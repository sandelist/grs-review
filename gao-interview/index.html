<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAO 面試準備</title><style>:root{color-scheme:dark;--bg:#002c55;--gold:#ffd446;--line:#ffffff40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;line-height:1.7}.wrap{max-width:900px;margin:auto;padding:24px 18px 70px}h1{font-size:24px;margin:0 0 8px}p.sub{font-size:13px;color:#ffffffad;margin:0 0 22px}nav{display:flex;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:20px}nav button{border:1px solid var(--line);background:transparent;color:#fff;padding:10px 16px;font:inherit;border-radius:4px;cursor:pointer}nav button[aria-selected=true]{border-color:var(--gold);color:var(--gold)}h2{font-size:18px;margin:22px 0 12px}details{border:1px solid var(--line);border-radius:5px;margin-bottom:10px;overflow:hidden}summary{padding:16px 15px;cursor:pointer;font-weight:600}article{padding:0 15px 18px;border-top:1px solid var(--line)}article h3{font-size:13px;color:var(--gold);margin:16px 0 4px}article p{margin:0;white-space:pre-line}small{color:#ffffffb3}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions button{background:transparent;border:1px solid var(--line);color:#fff;padding:7px 12px;border-radius:4px;cursor:pointer}input{background:#ffffff13;border:1px solid var(--line);color:#fff;border-radius:4px;padding:11px;width:100%;font:inherit;margin-bottom:12px}input::placeholder{color:#ffffff9c}.tag{font-size:12px;color:var(--gold);margin-right:9px}@media(max-width:500px){h1{font-size:21px}.wrap{padding:19px 13px}summary{padding:14px 12px}}@media print{body{background:white;color:black}nav,input,.actions button{display:none}details{border:1px solid #aaa}article{display:block!important}.tag,article h3{color:#333}}</style></head><body><main class="wrap"><h1>GAO 面試準備</h1><p class="sub">個人面試準備筆記 · 面試分析與經歷仍須本人核實 · 五年規劃內容按2026/27–2030/31官方全文整理</p><nav><button id="interview" aria-selected="true">面試思考</button><button id="plan" aria-selected="false">五年規劃</button></nav><div class="actions"><h2 id="heading">面試思考</h2><button id="toggle">全部展開</button></div><input id="filter" placeholder="搜尋問題或關鍵字" aria-label="搜尋內容"><section id="items"></section><footer style="border-top:1px solid var(--line);padding-top:17px;margin-top:38px;color:#ffffffad;font-size:12px">五年規劃部分依據《澳門大學五年發展規劃（2026/27–2030/31學年）》中文全文，附印刷頁碼；面試建議為個人準備分析，不是官方政策。<a href="https://www.gcs.gov.mo/news/detail/zh-hant/N26JIAG3vz" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">官方發佈消息</a></footer></main><script>const data={"groups":[["動機與定位","為何申請GAO？","把國際事務學術背景、在澳大接觸國際化工作的經歷，以及實際參與大學交流活動連成一條線；不是泛泛說喜歡大學。","SOAS國際研究與外交碩士；聯合國開發計劃署北京實習；澳大國際合作專題採訪與寫作；曾參與南京及北京的大學交流活動。","不要宣稱曾負責國際合作協議談判。"],["動機與定位","為何離開澳大，又希望回澳大？","當年轉到金沙中國，是希望接觸大型企業的溝通及跨部門工作；現在希望把兩種環境累積的經驗用於國際高等教育行政。","2018至2025年在澳大傳訊部；2025年2月起任金沙中國人力資源傳訊經理。","需要以本人具體的金沙工作成果補充，不能虛構。"],["動機與定位","為何是全球事務辦公室，而非傳訊部？","說明興趣由『介紹國際合作』延伸至『協助合作項目落實』，重點在聯絡、資料核實、協調、跟進。","曾撰寫三篇與澳大國際化、全球合作及葡萄牙高校聯繫有關的專題。","熟悉GAO工作不等於具備所有專門業務經驗。"],["經歷與能力","用一分鐘介紹自己","學歷背景→澳大六年半→金沙中國近兩年→申請GAO的原因。重點突出跨文化理解、雙語溝通、協調與準確性。","澳大傳播學學士、SOAS碩士、倫敦大學數據科學與人工智能碩士；UNDP實習。","英文或中文自我介紹都應用自然口語，不必背誦長段落。"],["經歷與能力","最能證明你了解澳大國際化的工作？","選2019、2024或2025年的專題，說明如何訪問、核實資料、把策略轉化為可理解內容。","2019〈全球策略提升國際聲譽〉；2024〈遷校十年 揚帆千里：拓展全球合作網絡〉；2025〈澳大與葡萄牙高校的結緣〉。","2019專題由本人主要撰寫；2024及2025為核心作者之一。"],["經歷與能力","說一個跨部門協調例子","先講目標與參與單位，再講協調難點、自己的具體行動及可核實的結果。","2020年協調十多個部門的大學網站模板升級；2023年虛擬校園導覽；年度大學簡介資料收集。","不要把參與說成單獨領導。"],["經歷與能力","有沒有實際組織校外交流的經驗？","描述校園記者、傳訊職員的大學參訪安排；說明接待、行程、跨校聯繫如何轉移至GAO工作。","曾參與赴廣州、北京、杭州、南京的交流策劃；親身參與中國傳媒大學及南京大學交流；安排校園記者參訪澳廣視及澳門日報。","具體負責哪些邀請、預算、行程環節，面試前須再核實。"],["經歷與能力","金沙中國的工作有何可轉移能力？","以大型企業內部傳訊的準確、時效、跨部門協作、對不同受眾調整語氣等為框架，加入真正親自負責的案例。","可能使用TRUE CARE刊物、myPRIZE、NBA中國賽員工傳訊或年度頒獎等項目，但具體職責尚待本人確認。","這是面試重要部分，目前證據仍需補充。"],["國際事務","怎樣處理海外大學提出合作建議？","先了解目的與範圍、核實對口學術單位和審批程序、安排溝通、記錄責任與期限；不作超越權限的承諾。","UNDP研究背景、澳大國際合作專題和實際交流策劃可支持理解能力。","不可自行保證簽署協議、獎學金或名額。"],["國際事務","如何推動葡語國家及其他海外夥伴合作？","由學科互補、師生交流、共同研究、短期課程和學術活動入手，重視合作是否產生實際成果。","SOAS論文研究澳門在中國與葡語非洲國家關係中的平台角色；曾翻譯澳門葡裔相關著作。","避免誇大澳門在外交談判中的實際角色。"],["情境應對","合作院校要求即時確認未獲批安排","先清楚區分已批准與待確認資訊；向主管及相關單位核實；對外禮貌回覆並提供預期跟進方式。","以資料準確及審批界限為核心。","切勿承諾錄取、資助、課程開設或簽約。"],["情境應對","海外代表團臨時更改行程","確認必須保留的核心會議，聯繫接待單位、交通、場地與翻譯；通知各方並更新行程表。","可連結過往大學參訪與跨部門協調經驗。","不要杜撰曾經處理過的突發事件。"],["情境應對","如何處理合作統計數字不一致？","先核對定義、統計期間、資料來源與更新日期，再向資料擁有人確認；留下版本記錄。","具備數據科學與人工智能碩士背景。","學位不能代替實際數據治理經驗。"],["個人特質","你最大的不足是甚麼？","坦誠指出尚未直接負責GAO協議審批或國際合作專案全流程，但具備相關背景，會主動學習制度及流程。","熟悉澳大行政環境及國際化內容。","避免把缺乏直接經驗說成完全沒有學習成本。"],["個人特質","對薪酬、穩定性及長遠發展的看法","以職務匹配、可持續投入與長期發展為重點；如被問到薪酬，坦誠但不必主動把『較輕鬆』當作理由。","曾在大學與企業兩種環境工作。","具體薪酬期望按招聘條件回答。"],["動機與定位","如果面試官問：為何離開澳大僅一年多又回來？","直接承認轉職是為了接觸大型企業運作，再把回大學的原因落在職務內容（國際合作、交流安排、資料準確、行政落實）和長期方向；不要假裝金沙不好或澳大比較輕鬆。","澳大傳訊部約六年半、金沙中國人力資源傳訊經理自2025年2月起。","金沙的實際貢獻需再整理後填入；避免空泛比較。"],["動機與定位","長遠職涯方向是否只是追求穩定？","承認穩定對長期工作有價值，但核心論述應是更符合國際事務教育背景與實際學校交流經驗的工作內容。能說出GAO的日常工作，才有說服力。","SOAS國際研究及外交、澳大國際化專題、學生與職員參訪策劃。","不要聲稱工作量會減少或將來一定更穩定。"],["經歷與能力","2019年國際合作專題：你實際做了甚麼？","敘述題目、訪問／資料收集、事實核實、如何讓全球合作策略變成容易理解的中英文內容。可以強調獨立撰寫，但不要延伸成自己決定大學策略。","《澳大新語》第21期〈全球策略提升國際聲譽〉；本人為中英文主要撰稿者。","文章的國際化資訊與GAO合作，但撰稿不等於直接執行合作協議。"],["經歷與能力","2024及2025年國際化專題有何代表性？","這些是延續性而非偶然的國際事務題材經驗：澳大跨境、葡語國家網絡、院校合作。準備各自一個能記得的採訪細節。","2024〈遷校十年 揚帆千里：拓展全球合作網絡〉；2025〈澳大與葡萄牙高校的結緣〉，均為核心撰稿者之一。","多作者作品不得說成個人獨立完成。"],["經歷與能力","UNDP北京實習可以怎樣連結GAO？","重點是國際發展議題研究、整理跨機構資料、雙語整理與學習跨文化工作環境，不必把六個月實習包裝成高層外交工作。","2017年聯合國開發計劃署中國辦公室全球夥伴關係與聯絡團隊實習約半年；參與研究支援及整理資料。","實習不是獨立負責國際談判或合作簽署。"],["經歷與能力","金沙項目應該如何向GAO表達？","每個案例用『職責→協調對象→難點→本人行動→結果→對GAO的用途』；優先選能證明獨立處理、有效率、兼顧準確和保密的項目。","已接觸的工作涉及TRUE CARE、myPRIZE、NBA中國賽、年度員工獎項及管理層訊息；角色與結果須由本人逐項確認。","不要把公司層面的成功當作本人全部功勞；此部分尚待完善。"],["情境應對","如果GAO收到海外院校訪問邀請或交流提議，第一步？","先釐清目的、涉及學科和擬定日期；核對校內對口單位與既有合作狀態，與主管確認接洽權限；取得初步意向後才安排議程、訪問及對外正式回覆。","曾參與多所內地大學的參訪交流活動，熟悉大學傳訊合作運作。","不自行批准訪問、簽署協議或承諾經費。"],["情境應對","海外合作協議臨近到期，處理次序？","檢查協議期限、雙方既有項目與實施記錄，向相關學術單位了解是否值得延續，再經適當程序處理續簽；同時保存版本與責任人。","細緻核對、資料整理、跨部門協調的工作基礎可轉移。","屬模擬處理方法，不表示曾在GAO親自管理協議。"],["情境應對","國際交流數據出現口徑不一致怎麼辦？","先統一定義：學年或曆年、已簽協議或活躍協議、實際交流人次或項目數，再追查資料擁有人及版本；對外數字需經確認。","跨部門資料核實及資料科學背景。","切勿未經核實就發布或自行修訂正式統計。"],["情境應對","雙校區與跨境交流有甚麼實務難點？","重點關注交通與行程、訪客出入境安排、時間表、行政對口、住宿及資訊一致性；以已核准指引和主管決定為準。","澳大網站及虛擬校園導覽的跨部門協調、交流活動安排。","不能假定兩校區規則完全相同或臆測法律細節。"],["情境應對","入職首三個月會怎樣做？","先熟悉合作協議、國際交流、來訪接待或統計報告的實際分工；向同事確認範本與審批流程；優先完成本職工作，逐步提出可執行改善。","熟悉澳大文化、基本行政流程及跨部門協作，仍須學習GAO的專業制度。","不要假設入職即能重設制度或主導策略。"],["面試表達","中英文回答如何避免內容過長？","回答以『一句結論→一個具體事例→一個與GAO的連結』為骨架；大多數問題先講60至90秒，再讓面試官追問。","學術背景及多年中英文編輯訓練。","不要背完整新聞稿式長文；英文追求清晰而非艱深。"],["面試表達","怎樣平衡自信與誠實？","可以強調寫作、協調、國際議題理解等已證實能力，並明確承認未經手GAO合作協議全流程。以主動學習和程序意識補上差距。","在澳大國際化報道和交流活動累積相關經驗，但未直接主導國際協議。","不要用『我不懂』結束答案，應說明學習和執行方法。"],["面試表達","面試官可能追問你較少的葡語能力","直接說明目前是初級（A1），不是工作交流程度。可以把葡語國家議題的學術理解與實際語言水平區分，再提及願意持續進修。","SOAS研究葡語非洲國家；曾翻譯澳門葡裔文化相關著作。","切勿聲稱流利葡語。"],["面試表達","最後可以反問面試官甚麼？","問目前職位日常較偏全球聯繫與活動，還是協議及統計；一年內最希望新同事掌握哪些工作；兩校區對GAO工作是否有新協作需求。","對GAO實際分工有興趣，非單純想回校工作。","不要以『能否準時下班』『是否很穩定』作為主要問題。"]],"plan":[["R.E.A.C.H.總體發展戰略","R：Resource-integrated 整合性；E：Excellence-focused 卓越性；A：Ambition-led 引領性；C：Collaboration-centric 開放性；H：High-impact 影響性。延續上一輪R.I.S.E.，強調跨境一校兩區、學科融合及國際影響。","對GAO較相關的是C（開放聯動、國際合作）與H（高影響的實質成果）。面試不應只背五個英文字。","第四章，第17–18頁"],["國際化專章：4S・4Zones・4Aims","4S：Strategic、Substantial、Specific、Sustainable；4Zones：葡（西）語系國家、英語系國家、一帶一路及亞太鄰近國家、中國內地及香港；4Aims：國際師資、國際課程、國際學生、國際交流。","這是GAO最核心的記憶框架；可用一句話說明『建立戰略性、實質性、具體而可持續的國際合作』。","第五章（四），第36頁"],["全球合作網絡目標","規劃提出高質量合作網絡覆蓋超過40個國家和地區、合作院校超過400所；同時深化網絡的合作質量及成效。","區分『未來五年目標』與『目前已達成數字』；合作夥伴數量以外還要看是否有共同研究、人才流動和項目成果。","第五章（四）1，第36頁"],["四大合作地區與院校例子","葡萄牙里斯本、科英布拉、波爾圖、米尼奧及新里斯本等；巴西、安哥拉、莫桑比克；西班牙巴塞隆拿大學；英語系英國、澳大利亞、新加坡、加拿大及新西蘭；亞洲包括越南、馬來西亞、韓國；內地及香港的C9+等高校。","如被問國際合作地區，先說原文四個地區，再舉一兩個代表院校，不必一次記住所有名字。","第五章（四）1，第36–37頁"],["每個學院／研究院／書院設國際項目","未來五年致力讓每個學院、研究院、書院均有國際項目；合作夥伴應按學術聲譽、學科互補及合作意願分類選擇。","GAO的實務支援可涵蓋對口聯繫、資料更新、校內協調、會議安排及合作成果追蹤；學術內容仍由相關單位主導。","第五章（四）2，第37頁"],["國際雙學位與聯合培養例子","規劃提出：醫學院與葡萄牙里斯本大學聯合開辦臨床醫學課程；信息學院、工學院、設計學院分別計劃與西班牙巴塞隆拿大學、澳大利亞沃隆港大學、英國倫敦大學布魯內爾學院開展雙學位項目。","使用『規劃提出／計劃』而非『已開辦／已批准』；面試可討論學術與行政單位如何分工、如何跟進協議落實。","第五章（四）2，第37頁"],["科研合作與中葡西平台","規劃提及建設中國—葡語國家海洋科學研究中心，與葡語國家院校在中醫藥、人文社科、語言文化等領域深化合作；亦推動與C9+院校共建科研平台。","可連結你對中國與葡語非洲國家關係的學術研究，但不要將澳門描繪為能替代國家外交或院校學術決策。","第五章（四）3，第38頁"],["國際聯盟與協會","規劃提及Erasmus+、葡萄牙語大學聯會（AULP）、國際大學生技術實習交流協會（IAESTE），以及粵港澳等高校聯盟。","GAO可能需要處理會員聯絡、活動安排、交流項目資訊與成果紀錄，但實際負責單位應以職位分工為準。","第五章（四）3，第38頁"],["師生交流與短期研習","一方面支持學生赴內地及海外夥伴高校短期訪學、交換和參與科研；另一方面擴大暑期研習營及短期學術訓練，吸引海外學生來澳大交流。","可與你參與南京及北京高校參訪的實際策劃經驗直接連結；不要把短期參訪說成完整交換生行政管理。","第五章（四）4，第38–39頁"],["引進國際會議與品牌活動","鼓勵引進高水平品牌學術會議及活動，與合作院校共同舉辦論壇、學術交流；促進國際能見度和學術聯繫。","可強調對外接待、活動資訊、不同單位協作、按時完成細節；如用金沙大型項目，先核實本人角色。","第五章（四）4，第38頁"],["國際招生與獎助學金","五年規劃提出為國際碩士生設A、B、C類獎學金，完善獎助支援；改組招生委員會，優化跨部門程序。","不要自行承諾獎學金、學額或錄取；GAO可能與招生及研究生院協調，但正式評審和批准權限須分清。","第五章（四）5，第39–40頁"],["國際交流學生支援與合作成效","規劃強調跨校學分互認、學籍管理、住宿及文化適應支援，並建立合作成果評估回饋，跟蹤雙學位、科研及學術交流項目的實施。","這是『從協議數量轉向實質成效』的最佳例子。回答可談記錄項目狀態、聯繫責任人、按相同定義整理數據。","第五章（四）5，第39頁"],["研究生教育國際化","規劃提出聚焦國際碩士招生；向馬來西亞、越南等亞洲市場宣傳，拓展雙學位及交流；推動博士交流及研究生教育的質素保障。","GAO與GRS的職務不同，但合作項目、海外夥伴及國際學生服務互相關連，可用作跨部門合作示例。","第五章（一）4，第23–24頁"],["2030/31學年學生規模","規劃表6預計2030/31學年總學生22,211人，其中研究生12,324人（約55%）。澳門主校區18,244人，合作區校區3,967人；其中約2,000人將同時在兩個校區上課及科研。","分清總學生數、研究生數和不同校區數字；雙校區同時活動的學生不要簡單重複相加。","第五章（一）2，表6，第21頁"],["兩校區住宿式書院","規劃表7預計全校20間書院，其中本科生14間、研究生6間；澳門主校區12間、合作區校區8間。研究生書院主題包括創新與跨領域交流、卓越研究、全球交流。","對國際學生交流和文化適應可連結住宿式書院，但書院管理不等於GAO直接職責。","第五章（一）3，表7，第22–23頁"],["橫琴新校區時間表及管理","新合作區校區預計2028年部分啟用、2029年全面建成，2030年進入擴容完善；主校區與合作區校區採一體化管理，教學、取得學歷與運作要求保持一致。","區分2026已有的橫琴過渡期延伸辦學與新校區落成；討論跨境合作時注意法律、行政、活動和聯絡差異。","第六章（二）及（三），第45–47頁"],["科研策略N.E.T.","Nurturing Cores（強化核心）、Enabling Ecosystem（培育集群）、Threading Networks（縱橫連結）。三所全國重點實驗室為中醫藥、微電子及智慧城市物聯網；發展人工智能與腦科學、生物醫學與臨床轉化、智能醫學工程、能源及碳中和平台。","記住這是科研戰略，不要把它混作國際化4S；GAO可協助科研國際交流，但不主導科研學科決策。","第五章（二），第26–28頁"],["跨境數據與數碼行政","規劃提出加強兩校區網絡及跨境可信數據流通，優先推動研究生申請成績單驗真，並推進UM Flow等辦公數碼化工具。","你的數據科學學位可輔助理解資料品質、版本及合規，但面試不要聲稱自己已經實際建立相關跨境系統。","第六章（二）及（三），第45–47頁"],["SDGs與國際合作","規劃將可持續發展目標納入大學整體策略，並鼓勵與政府、企業、國際組織及聯盟在可持續發展領域合作。","可回答GAO如何推動有社會影響的國際學術活動；要注意這是跨部門議題。","第六章（四），第48頁"]]};let mode=location.hash==='#plan'?'plan':'interview';const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const isPlan=mode==='plan';$('interview').setAttribute('aria-selected',String(!isPlan));$('plan').setAttribute('aria-selected',String(isPlan));$('heading').textContent=isPlan?'五年規劃':'面試思考';const search=$('filter').value.trim().toLowerCase();const rows=isPlan?data.plan:data.groups;const result=rows.filter(row=>row.join(' ').toLowerCase().includes(search));$('items').innerHTML=result.map(row=>isPlan?'<details><summary>'+escape(row[0])+'</summary><article><h3>規劃重點</h3><p>'+escape(row[1])+'</p><h3>面試連結</h3><p>'+escape(row[2])+'</p><h3>規劃原文位置</h3><p>'+escape(row[3]||'')+'</p></article></details>':'<details><summary><span class="tag">'+escape(row[0])+'</span>'+escape(row[1])+'</summary><article><h3>建議答題方向</h3><p>'+escape(row[2])+'</p><h3>可用的真實經歷</h3><p>'+escape(row[3])+'</p><h3>注意</h3><p>'+escape(row[4])+'</p></article></details>').join('')||'<p>沒有符合的內容。</p>';$('toggle').textContent='全部展開';}for(const id of ['interview','plan'])$(id).onclick=()=>{mode=id==='plan'?'plan':'interview';history.replaceState(null,'','#'+mode);render();};$('filter').oninput=render;$('toggle').onclick=()=>{const d=[...document.querySelectorAll('details')],expand=d.some(x=>!x.open);d.forEach(x=>x.open=expand);$('toggle').textContent=expand?'全部收起':'全部展開';};render();</script></body></html>
