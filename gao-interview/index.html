<style>
:root{color-scheme:dark;--bg:#082e55;--line:#ffffff2f;--gold:#ffd44d;--text:#f7f8fc;--muted:#dae4ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
main{width:min(100%,890px);margin:0 auto;padding:26px 20px 74px}
h1{font-size:25px;font-weight:760;letter-spacing:.018em;margin:0 0 23px}
nav{display:flex;gap:8px;margin:0 0 29px;flex-wrap:wrap}
nav button{color:var(--muted);border:1px solid var(--line);background:transparent;cursor:pointer;font:inherit;font-size:14px;font-weight:550;padding:9px 14px;border-radius:4px;min-height:43px}
nav button[aria-selected="true"]{border-color:var(--gold);color:var(--gold);font-weight:720}
nav button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
section.topic{margin:0 0 29px}
h2{font-size:16px;letter-spacing:.02em;color:var(--gold);margin:0 0 10px;font-weight:700}
details{border:1px solid var(--line);border-radius:7px;margin:0 0 10px;background:#ffffff04;overflow:hidden}
summary{list-style:none;display:flex;align-items:flex-start;gap:11px;padding:17px 17px;cursor:pointer;font-size:16px;line-height:1.6;font-weight:650}
summary::-webkit-details-marker{display:none}
summary:before{content:"";width:8px;height:8px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);margin:9px 4px 0 1px;flex:0 0 8px;transition:transform .15s ease}
details[open]>summary:before{transform:rotate(45deg)}
article{padding:3px 19px 21px 41px;color:var(--muted);font-size:15px;line-height:1.85}
article p{margin:0 0 13px;white-space:pre-line}
article p:last-child{margin-bottom:0}
[hidden]{display:none!important}
@media(max-width:520px){main{padding:22px 13px 56px}h1{font-size:23px;margin-bottom:20px}nav{gap:7px;margin-bottom:24px}nav button{font-size:13px;padding:9px 10px}summary{font-size:15px;padding:15px 13px;gap:9px}article{font-size:14px;padding:0 14px 18px 35px;line-height:1.85}h2{font-size:15px}}
@media print{body{background:#fff;color:#111}main{max-width:none}nav{display:none}h2{color:#333}article{color:#111}summary:before{display:none}details{border-color:#bbb}}
</style>

<body>
<main>
<h1>橫琴見面會</h1>
<nav aria-label="內容">
<button type="button" data-mode="interview" aria-selected="true">面試</button>
<button type="button" data-mode="zh" aria-selected="false">五年規劃</button>
<button type="button" data-mode="en" aria-selected="false" lang="en">Five-Year Plan</button>
</nav>
<div id="content"></div>
</main>
<script>
const DATA={"interview":[["求職動機",[["請介紹自己。","我本科畢業於澳門大學傳播學系，其後在倫敦大學亞非學院修讀國際研究與外交碩士，亦取得倫敦大學數據科學與人工智能碩士學位。2017年曾在聯合國開發計劃署北京辦公室實習。之後在澳大傳訊部工作約六年半，主要處理中英文傳訊、專題採訪和跨部門項目；2025年2月加入金沙中國，擔任人力資源傳訊經理。希望結合對澳大的認識、國際事務背景及企業經驗，參與國際高等教育合作。"],["為何申請全球事務辦公室？","國際事務一直是我學業和工作中持續關注的方向。SOAS的研究、聯合國開發計劃署實習，以及在澳大撰寫國際合作專題和參與校際交流，讓我熟悉相關議題。我希望由介紹大學的國際化工作，進一步參與院校聯繫、交流項目及合作安排的實際執行。"],["為何離開澳大，又希望回來？","在澳大工作六年多後，我希望接觸大型企業的工作方式，因此轉到金沙中國從事人力資源傳訊。在企業環境中，我接觸到更重視時效、執行和跨部門配合的工作要求。這段經驗讓我更清楚自己的長遠方向：我希望把過去兩種環境的經驗結合，投入與國際高等教育有直接關係的行政工作。"],["為何選GAO，而不是回傳訊部？","過去我在傳訊部主要負責把澳大的國際合作和發展方向向不同受眾解釋清楚。我也參與過內地大學參訪策劃，對實際交流工作有興趣。GAO更貼近夥伴院校聯絡、交流安排和合作跟進，我希望將雙語寫作、資料核實及協調能力用於這些工作。"],["你是否只是想找較穩定的工作？","長遠發展和工作環境當然是考慮因素，但我對這個職位的興趣有清楚脈絡：國際事務學術訓練、澳大國際化專題及校際交流經驗。我認為自己的能力和興趣與GAO的工作內容較相符，也願意學習其專業制度，作長期投入。"],["你如何理解GAO的價值？","大學國際化不只是簽署更多協議，而是要讓合作真正帶來師生交流、共同研究、聯合培養和持續聯繫。GAO的行政工作需要把合作意向轉化成可跟進的項目，協調相關單位、確保資料準確，並定期掌握合作成果。"]]],["澳大工作經歷",[["哪一項工作最能證明你了解澳大國際化？","2019年我主要撰寫《澳大新語》〈全球策略提升國際聲譽〉的中英文專題，報道澳大的國際化策略及合作方向。其後我亦是2024年〈拓展全球合作網絡〉和2025年〈澳大與葡萄牙高校的結緣〉的核心作者之一。這些工作讓我長期接觸大學與海外院校合作的內容，亦訓練了我核實資料和準確表達的能力。"],["2019年的專題有甚麼特別？","該專題以澳大的全球策略為主題，我是中英文主要撰稿者。要把較宏觀的國際化理念寫成可以讓校內外讀者理解的文章，必須了解合作的背景、目的及具體例子，並與相關單位核對內容。這段經驗也讓我開始更深入關注澳大的國際合作工作。"],["你有實際組織交流活動的經驗嗎？","我曾參與策劃校園記者及傳訊部同事赴廣州、北京、杭州和南京等地的大學參訪交流，自己亦曾參與中國傳媒大學及南京大學的交流活動。在澳門，我還參與安排校園記者參訪澳廣視及《澳門日報》。這些工作雖然不是GAO的正式校際合作項目，但在對外聯繫、行程協調及活動安排上有共通之處。"],["請舉一個跨部門協調項目。","2020年我參與統籌大學網站模板升級，涉及十多個行政及學術單位，包括全球事務辦公室。這類工作要先確定共同標準，再了解各單位的不同需要，保持溝通，及時跟進資料和進度。我也參與過虛擬校園導覽及年度大學簡介資料收集等跨部門項目。"],["虛擬校園導覽如何體現你的能力？","2023年的虛擬校園導覽涉及多個學院、校園設施及製作單位，面向不一定能親身到訪澳大的使用者，包括校外及國際學生。這類工作需要把不同單位的資訊整合，配合製作時程，並確保呈現的校園資訊清楚一致。"],["你的寫作能力與GAO有甚麼關係？","我有多年中英文編輯和核實資料的經驗，知道同一份資訊面向學生、學者、海外夥伴或大學管理層時，語氣和重點應有所不同。GAO的邀請函、交流資訊、會議摘要、工作報告和對外電郵同樣需要準確、清晰和得體。"],["在澳大工作多年，為何仍需要適應GAO？","我熟悉澳大的基本行政文化、部門協作方式和國際化背景，但並沒有直接負責過GAO的協議管理或國際合作審批全流程。因此入職後仍須學習工作指引、權限和程序。熟悉大學能幫助我較快找到對口單位，但不能代替專業學習。"]]],["國際事務與專業",[["SOAS的研究與GAO工作有何關係？","我的碩士研究關注澳門在中國與葡語非洲國家關係中的平台角色。研究讓我明白澳門在國際關係中的作用需要實事求是，但在教育、人才培訓、學術交流與合作網絡方面，確實有可發揮的空間。這種理解有助我思考合作項目是否具體、可行和互利。"],["UNDP實習讓你學到甚麼？","我在聯合國開發計劃署中國辦公室的全球夥伴關係與聯絡團隊實習約半年，協助研究及整理與一帶一路和發展合作相關的資料，包括翻譯、圖表和研究簡報。這讓我習慣處理跨機構資料，理解國際發展議題需要準確研究和清楚溝通。"],["如何推進與葡語國家大學的合作？","我會先看學科是否互補，以及雙方有沒有持續交流的資源和意願。可以從師生交流、短期課程、聯合研究或學術活動開始，再按成果深化合作。澳大在葡語文化和學科網絡方面有基礎，但合作不能只停留在簽署備忘錄。"],["你的葡語能力如何？","我的葡語目前屬初級A1水平，不能把自己描述成能流利處理葡語公務。不過，我透過學術研究、澳大專題和翻譯工作接觸葡語國家及澳門相關文化議題。涉及正式葡文溝通時，我會依靠合適的語言專業支援並繼續進修。"],["數據科學學位對GAO有何用途？","我的數據科學與人工智能學習有助我重視資料定義、品質和分析方法。對合作協議或國際交流統計，我會先分清統計期間、院校、協議狀態和實際參與人次，再核對來源，避免把不同口徑的數字直接比較。"]]],["金沙中國工作",[["金沙中國的工作如何幫助你勝任GAO？","在金沙中國，我的工作重點是人力資源傳訊，需要把資訊整理得清楚、準確，按不同受眾及期限協調內容和發佈安排。我希望把企業環境的執行意識、時間管理和跨部門協作方式，帶回大學的國際合作行政工作。"],["在金沙中國接觸過哪些主要項目？","我接觸過TRUE CARE服務文化及刊物、myPRIZE員工參與活動、NBA中國賽的員工傳訊，以及員工年度大獎等工作。這些項目涉及不同受眾和工作時限，需要準確整理訊息，並與不同部門協調內容和執行安排。"],["如何比較企業與大學的工作方式？","兩者都要求準確、尊重程序及跨部門合作。企業傳訊往往更重視短時間內對大量員工的有效傳達；大學國際合作則需要兼顧不同學術單位、海外夥伴和較長的項目周期。我希望把前者的執行效率與後者的制度及學術要求結合。"]]],["情境與判斷",[["海外院校提出合作，第一步做甚麼？","先了解合作目的、學科範圍、對方的意向與時間表，核查澳大是否已有合作關係，再與主管及相關學術單位確認。取得內部意見後安排初步交流，記錄後續責任和期限，不在未經批准時承諾簽約、學額或資助。"],["一份國際合作協議即將到期，怎麼處理？","先核對協議期限、相關條款及歷年合作記錄，詢問對口學術單位是否仍有合作需求，再整理續簽或調整方案供主管按程序處理。對外溝通前須確認權限，並保留清楚的版本與跟進記錄。"],["外國代表團臨時更改行程，怎麼辦？","先確認對方的必需安排和時間限制，與校內接待、學術單位及交通場地負責人協調可行方案；優先保留核心會議，更新議程並通知所有相關人員。若涉及超出權限的改動，應先向主管報告。"],["合作統計數字與另一部門不一致，怎麼辦？","先檢查是否使用相同統計期間和定義，例如已簽協議、仍有效協議、實際執行項目，以及交流人次或人數；再核對資料來源和更新日期，向資料擁有人確認後才使用正式數字。"],["兩校區為國際交流帶來哪些挑戰？","要兼顧訪客行程、跨境流動、活動場地、學術單位聯絡、學生支援和資訊一致性。由於兩地適用的制度可能不同，應依據大學核准安排，提早確認每個行政環節的責任人，避免合作夥伴收到互相矛盾的資訊。"]]],["個人表達",[["最大的優勢是甚麼？","我熟悉澳大的工作環境，同時有國際事務學術背景及雙語傳訊經驗。較具體的優勢是能把複雜資訊整理清楚、與不同單位協調，以及在對外溝通前重視事實核實。這些能力與GAO的行政支援工作相符。"],["最大的不足是甚麼？","我尚未直接管理過國際合作協議或負責GAO項目的整個審批流程。我的做法是先熟悉制度與範本，了解每個環節的權限和時限，透過已掌握的寫作、資料整理及協調能力逐步承擔更多工作。"],["入職後三個月會怎樣做？","先理解團隊實際分工、現行合作項目、重要夥伴以及文件與統計制度；熟悉對外聯絡及審批流程，與相關單位建立工作關係。在做好日常任務後，再根據實際需要提出改善跟進或資料整理的方法。"],["如果要用英文簡介自己？","I graduated from the University of Macau with a degree in Communication and later completed a master's degree in International Studies and Diplomacy at SOAS, University of London. I also hold a master's degree in Data Science and Artificial Intelligence from the University of London. I worked in UM's Communications Office for around six and a half years, where I covered international partnerships and coordinated cross-departmental projects. I now work in HR communications at Sands China. I hope to bring my understanding of UM, international affairs background and communication experience to the Global Affairs Office."]]]],"zh":[["R.E.A.C.H. 發展戰略","澳大承接上一個五年的R.I.S.E.理念，推行R.E.A.C.H.總體發展戰略，配合跨境「一校兩區」建設，朝「中國一流、全球卓越」的大學目標邁進。\n\nR：Resource-integrated（整合性）——建立跨境教研協同機制，促進學科及資源深度整合。\nE：Excellence-focused（卓越性）——以卓越人才培養、研究、國際合作、社會服務和治理服務澳門與國家發展。\nA：Ambition-led（引領性）——提升澳大在澳琴一體化及大灣區發展中的引領作用。\nC：Collaboration-centric（開放性）——引入全球學術資源，推動跨界聯動及產學研合作。\nH：High-impact（影響性）——以教研成果貢獻社會，提升國際學術聲譽及全球影響。"],["4S・4 Zones・4 Aims","澳大的國際化工作以「4S・4 Zones・4 Aims」為框架，旨在提升課程、生源、師資及合作項目的質量，建設國際化、協作化的教研樞紐。\n\n4S：Strategic（戰略性）、Substantial（實質性）、Specific（具體性）、Sustainable（可持續性）。\n4 Zones：葡語及西語系國家；英語系國家；「一帶一路」沿線及亞太鄰近國家；中國內地及香港地區（C9+及一流大學）。\n4 Aims：國際師資、國際課程、國際學生、國際交流。"],["全球合作網絡","未來五年，澳大計劃建設覆蓋超過40個國家和地區、合作院校超過400所的高質量國際合作網絡。除了擴大合作範圍，大學亦着重提高合作深度、拓展國際招生及增強國際影響力。\n\n在選擇合作夥伴時，澳大將優先考慮學術聲譽良好、學科優勢互補及合作意願強的院校，並建立校際、院際及學科層面的常態化聯繫機制。"],["四大合作地區","葡語及西語系國家：加強與葡萄牙里斯本大學、科英布拉大學、波爾圖大學、米尼奧大學、新里斯本大學，以及巴西、莫桑比克、安哥拉的知名院校合作；拓展與西班牙巴塞隆拿大學及南美洲院校的關係。\n\n英語系國家：鞏固與英國、澳大利亞、新加坡、加拿大和新西蘭知名大學的合作。\n\n「一帶一路」及亞太鄰近國家：重點聯繫越南、馬來西亞、韓國等具合作潛力的院校。\n\n中國內地及香港地區：升級與C9+等頂尖高校的戰略合作，推進跨學科及多層次交流。"],["各學術單位的國際項目","澳大致力實現「每個學院／研究院／書院均設有國際項目」，推動國際化工作深入各學術及住宿書院單位。合作重點不只是建立夥伴關係，更要發展可實施的雙學位、人才聯合培養、科研合作與師生交流項目。\n\n在合作區校區，醫學院、信息學院、工學院及設計學院是國際聯合培養與雙學位合作的重點單位。"],["國際雙學位及聯合培養","在合作區校區，澳大計劃推進多項跨國合作課程。醫學院將與葡萄牙里斯本大學聯合開辦臨床醫學課程；信息學院、工學院及設計學院計劃分別與西班牙巴塞隆拿大學、澳大利亞沃隆港大學及英國倫敦大學布魯內爾學院建立雙學位項目。\n\n大學亦將與仁伯爵綜合醫院及協和澳門醫學中心共建教學醫院，推動臨床人才培養和科研合作，並繼續與世界知名大學開展其他學科的聯合培養。"],["科研合作與中葡西平台","澳大將進一步發揮澳門作為中國與葡語、西語國家之間的平台作用，推動科技及教育合作，並建設「中國—葡語國家海洋科學研究中心」。\n\n與里斯本大學、科英布拉大學等院校的合作將集中於中醫藥、人文社科、語言文化等特色領域；與內地C9+等頂尖高校則圍繞重點學科建設聯合研究中心、實驗室及其他創新平台，共同開展重大科研項目。"],["國際高校聯盟及交流組織","澳大將積極參與國際高校聯盟及協會，促進科研、學術研討及文化交流。規劃提及Erasmus+、葡萄牙語大學聯會（AULP）和國際大學生技術實習交流協會（IAESTE），以加強與歐盟、葡語國家及其他海外院校的人員往來。\n\n大學亦會參與粵港澳高校聯盟、粵港澳大灣區西岸科技創新和人才培養聯盟、蘇港澳高校合作聯盟、魯港澳高校院所創新聯盟等區域合作網絡。"],["與頂尖學府的師生交流","澳大將持續參與哈佛燕京學社訪問學者交流計劃、英國劍橋大學卡萊爾堂客座研究員計劃，以及牛津大學奧利爾學院的國際師生交流項目。\n\n大學會選送優秀學生赴內地一流高校和海外夥伴院校進行短期訪學、交換學習，並參與科研和學術活動；同時擴大暑期研習營及短期學術訓練，吸引海外學生到澳大交流，建立長期、可持續的學術及人文聯繫。"],["國際學術會議及品牌活動","澳大將引進具有國際聲譽的高水平品牌學術會議及活動，並與合作院校共同舉辦面向一流大學建設的學術活動。\n\n各學院及研究機構將獲鼓勵定期舉辦年度性、系列化的國際學術論壇，聯繫全球優質學術資源，提升大學在國際學術界的能見度；同時引進國際前沿課程體系、教學模式及評估標準，重點優化數據科學、人工智能、藥學及健康科學等領域的課程。"],["國際學生招生及獎助學金","澳大將優化國際招生策略，完善獎助學金類別及資助水平，為國際碩士生設立A、B、C類獎學金，覆蓋學費、生活費等核心支出；並為來澳大參與學期交流及暑期研習的國際學生提供多元化資助。\n\n大學亦計劃簡化國內外合作交流及國際招生的內部行政程序，改組大學層面的招生委員會，提升跨部門協作與決策效率。"],["聯合培養學生支援與合作成效","澳大將加強與內地及葡語、西語、英語系國家合作院校聯合培養學生的全過程管理，改善跨校學分互認、學籍管理、住宿安排及文化適應指導等支援。\n\n同時建立合作成效的評估和回饋機制，定期檢視與夥伴院校在雙學位、科研項目和學術交流方面的成果，跟蹤項目實施進度，並持續優化合作策略與學生服務。"],["研究生教育國際化","澳大將以全球融合及卓越發展為方向，深化國際合作、優化培養體系和強化質量保障，重點拓展碩士課程的國際生源。\n\n招生方面將加強與內地一流高校的推薦機制、針對目標院校和特定課程精準宣傳，並開拓馬來西亞、越南等亞洲市場；同時參與國際教育展、發展雙學位及交流計劃、在宣講會加入體驗元素，以及優化收生程序。\n\n博士教育方面將推動「轉化研究」單元、建立大學層面的博士研究交流計劃，並發展數據驅動的研究生管理系統。"],["2030/31學年學生規模","澳大計劃在2030/31學年達到22,211名學生，其中本科生9,887人、研究生12,324人；研究生佔全校學生約55%。\n\n按校區計算，澳門主校區預計18,244人，合作區校區3,967人。主校區的數字包括約2,000名同時在兩個校區上課及開展科研的學生。人文社科與理工醫藥類學生的規模比例預計達1:1。\n\n較長期目標則是在2035年將全校學生總數增加至25,000人。"],["住宿式書院與研究生書院","澳大未來計劃在兩個校區合共設立20間住宿式書院，包括14間本科生書院和6間研究生書院。澳門主校區為12間、合作區校區為8間，其中兩個校區各設3間研究生書院。\n\n研究生書院以「創新與跨領域交流」、「卓越研究」及「全球交流」為主題，主要支援研究生、國際生、交流生及相關研究人才，並透過核心課程與書院特色活動促進科研、創新及跨文化交流。"],["橫琴校區與一校兩區","澳大合作區新校區預計2028年部分啟用、2029年全面建成，2030年進入擴容和完善階段；這與已開展教學的橫琴第一期辦學安排屬不同階段。\n\n兩個校區將採取一體化管理，在管理體制、運作經營、學生培養和學歷取得等方面保持一致，同時符合澳門與合作區兩地的法律要求。合作區校區將設管理委員會及運營實體，主校區職能部門亦將設相應辦公室，推動跨境協作。"],["N.E.T. 科研戰略","澳大將科研發展由傳統「四個三」架構升級為N.E.T.策略。\n\nN：Nurturing Cores（強化核心）——以中醫藥、微電子和智慧城市物聯網三所全國重點實驗室為重要核心，建立「實驗室＋研究院」的協同體系。\nE：Enabling Ecosystem（培育集群）——建設人工智能與腦科學、生物醫學與臨床轉化、智能醫學工程、能源及碳中和等跨學科科研平台。\nT：Threading Networks（縱橫連結）——發揮「一校兩區」優勢，連結校內研究資源與大灣區產業及市場需求，建設區域創新網絡。"],["跨境數據與數碼行政","澳大將建設跨校區專用網絡及可信跨境數據流通體系，改善教學、科研與行政資訊的互通及安全管理。\n\n規劃包括推動新一代資訊系統、UM App智能化升級及UM Flow辦公室自動化平台；亦將優先推進研究生入學申請成績單驗真，連接學信網驗證及大灣區院校互認，並建立跨境數據安全風險評估和應急處理機制。"],["可持續發展與國際合作","澳大將聯合國可持續發展目標（SDGs）納入大學整體戰略，研究成立由大學領導統籌的可持續發展機構，連結教學、科研、校園管理、社會服務和國際合作。\n\n在研究方面，聚焦健康福祉、智慧城市、環境保護等全球議題；在國際合作方面，與澳琴兩地政府、企業、國際組織和全球聯盟深化合作，推動可持續發展、社會責任及ESG治理。"]],"en":[["R.E.A.C.H. Development Strategy","Building on the previous R.I.S.E. framework, UM will implement the R.E.A.C.H. strategy to advance the cross-border ‘One University, Two Campuses’ model and move towards becoming a ‘first-class university in China with world excellence’.\n\nR — Resource-integrated: Strengthen cross-border coordination in teaching and research, integrate disciplines and resources, and develop a unified operating model.\nE — Excellence-focused: Pursue excellence in education, research, international cooperation, social service and institutional governance.\nA — Ambition-led: Strengthen UM's leadership in Macao's higher education sector, Macao–Hengqin integration and Greater Bay Area development.\nC — Collaboration-centric: Draw on international networks to attract academic resources and promote collaboration with society and industry.\nH — High-impact: Generate valuable education and research outcomes, contribute to major societal needs and raise UM's international academic influence."],["4S • 4 Zones • 4 Aims","UM will pursue internationalisation through the ‘4S • 4 Zones • 4 Aims’ framework, strengthening the quality of its programmes, student intake, academic staff and collaborative initiatives.\n\n4S Strategy: Strategic, Substantial, Specific and Sustainable.\n\n4 Zones: Portuguese- and Spanish-speaking countries; English-speaking countries; countries along the Belt and Road and neighbouring Asia-Pacific countries; and the Chinese Mainland and the Hong Kong SAR, including C9+ institutions and other top universities.\n\n4 Aims: International faculty members, internationalised programmes, international students and international exchange.\n\nThe overall objective is to establish UM as an internationally oriented, collaborative and dynamic hub for teaching and research."],["Global Partnership Network","UM aims to develop a high-quality global partnership network spanning more than 400 partner institutions across over 40 countries and regions. The strategy emphasises not only the geographic reach of partnerships but also deeper academic collaboration, international student recruitment and greater global visibility.\n\nThe University will review prospective and existing partners in a structured manner, prioritising institutions with strong academic reputations, complementary disciplinary strengths and a clear willingness to cooperate. It will develop regular channels for communication and coordination at the university, faculty and disciplinary levels."],["Four Priority Regions","Portuguese- and Spanish-speaking countries: UM will reinforce links with institutions in Portugal, including the University of Lisbon, the University of Coimbra, the University of Porto, the University of Minho and NOVA University Lisbon. It will also engage institutions in Brazil, Mozambique and Angola, and seek new partnerships in Spain and South America.\n\nEnglish-speaking countries: UM will consolidate cooperation with institutions in the UK, Australia, Singapore, Canada and New Zealand.\n\nBelt and Road and neighbouring Asia-Pacific countries: Priority markets include Vietnam, Malaysia and South Korea.\n\nChinese Mainland and Hong Kong SAR: UM will upgrade strategic partnerships with C9+ members and other leading institutions, developing regular and multi-level mechanisms for engagement."],["International Programmes Across Academic Units","UM aims for each faculty, institute and residential college to offer international programmes. The University will move beyond establishing institutional links by developing substantive dual degree programmes, joint education, collaborative research and academic exchange opportunities.\n\nOn the Cooperation Zone campus, particular attention will be given to international collaboration involving the Faculty of Medicine, Faculty of Information Science and Computing, Faculty of Engineering and Faculty of Design. Partners will be selected on the basis of their academic standing, disciplinary complementarity and willingness to pursue workable cooperation."],["International Dual Degrees and Joint Education","UM plans to develop international programmes involving several academic units on the Cooperation Zone campus. The Faculty of Medicine will work with the University of Lisbon in Portugal to jointly offer a clinical medicine programme. The Faculty of Information Science and Computing, Faculty of Engineering and Faculty of Design plan to establish dual degree programmes with the University of Barcelona in Spain, the University of Wollongong in Australia and Brunel University of London in the UK, respectively.\n\nUM will also cooperate with Conde S. Januário Hospital and the Macao Medical Center of Peking Union Medical College Hospital in developing a teaching hospital, and will continue to explore collaborative education with renowned universities in other disciplines."],["Research Collaboration and the China–Lusophone–Hispanophone Platform","UM will strengthen Macao's role as a platform linking China with Portuguese- and Spanish-speaking countries in science, technology and education. A key initiative is the proposed Centre for Ocean Research between China and Portuguese-speaking Countries.\n\nCooperation with institutions such as the University of Lisbon and the University of Coimbra will focus on distinctive strengths, including Chinese medicine, humanities and social sciences, language and cultural studies. With members of the C9+ League and other leading institutions in the Chinese Mainland, UM will explore joint research centres, laboratories and major collaborative research projects."],["University Alliances and Exchange Organisations","UM will deepen its participation in university alliances and associations as a means of supporting research cooperation, academic seminars, cultural exchange and staff and student mobility.\n\nThe plan highlights Erasmus+, the Association of Portuguese Language Universities (AULP) and the International Association for the Exchange of Students for Technical Experience (IAESTE) as channels for engagement with institutions in the European Union, Portuguese-speaking countries and other regions.\n\nUM will also participate in regional alliances such as the Guangdong–Hong Kong–Macao University Alliance, the alliance for technology, innovation and talent development in the western Greater Bay Area, and the Jiangsu–Hong Kong–Macao and Shandong–Hong Kong–Macao university collaboration networks."],["Exchanges with Leading Universities","UM will continue to participate in programmes such as the Harvard-Yenching Institute Visiting Scholars Programme, the Clare Hall Visiting Fellowship Programme at the University of Cambridge, and international exchange activities associated with Oriel College at the University of Oxford.\n\nThe University will encourage outstanding students to undertake short-term study visits and exchanges at leading institutions in the Chinese Mainland and overseas, including participation in research projects and academic activities. It will also expand summer camps and short-term academic training programmes, attracting students from international partner institutions to UM and developing sustained academic and people-to-people connections."],["International Conferences and Flagship Academic Events","UM will attract internationally recognised flagship conferences and academic events and co-host activities with partner institutions. Faculties and research institutes will be encouraged to organise annual conferences and thematic series of international academic forums to connect with high-calibre global academic resources and increase the University's international visibility.\n\nThe plan also calls for closer alignment with leading international curricula, teaching practices and assessment standards. Priority areas for curriculum enhancement include data science, artificial intelligence, pharmacy and health sciences."],["International Recruitment and Scholarships","UM will strengthen incentives, streamline administration and improve support for international student recruitment. It plans categorised scholarship arrangements — Categories A, B and C — for international master's students, covering key expenses such as tuition and living costs. Additional financial support will be made available for international students taking part in semester exchanges and summer programmes at UM.\n\nThe University also intends to streamline internal procedures for exchange programmes and international recruitment, and to restructure the university-level admissions committee to improve coordination among relevant functional units and the efficiency of decision-making."],["Joint-Programme Student Support and Partnership Outcomes","UM will strengthen whole-process management of students in joint education programmes with partner institutions in the Chinese Mainland and Portuguese-, Spanish- and English-speaking countries.\n\nSupport measures will cover cross-university credit transfer, student record management, accommodation and cultural orientation. A feedback and evaluation mechanism will review the effectiveness of partnerships and monitor the progress of dual degree programmes, research projects and academic exchange activities. Findings from these reviews will be used to refine cooperation strategies and student services."],["Internationalisation of Postgraduate Education","UM aims to advance postgraduate education through global engagement, educational excellence and stronger quality assurance, with particular emphasis on expanding international student recruitment for master's programmes.\n\nRecruitment measures include recommendation mechanisms with leading institutions in the Chinese Mainland, targeted publicity for selected institutions and programmes, outreach in Asian markets such as Malaysia and Vietnam, participation in international education fairs, dual degree and exchange opportunities, and more experience-based recruitment events.\n\nIn doctoral education, the University plans to introduce translational research into PhD curricula, establish a university-level doctoral research exchange programme and upgrade its digital postgraduate management arrangements."],["Student Population in 2030/31","The five-year plan projects a total student population of 22,211 in the academic year 2030/31, including 9,887 undergraduates and 12,324 postgraduates. Postgraduates are expected to account for approximately 55 per cent of all students.\n\nBy campus, the projection is 18,244 students on the Macao main campus and 3,967 on the Cooperation Zone campus. The main-campus figure includes approximately 2,000 students who will attend classes and undertake research on both campuses. The plan also envisages a 1:1 ratio between humanities and social sciences students and science, engineering and medicine students.\n\nA longer-term institutional goal is to reach 25,000 students by 2035."],["Residential Colleges and Postgraduate Colleges","UM plans to expand its residential college network to 20 colleges across two campuses, comprising 14 undergraduate and six postgraduate colleges. The main campus is expected to have 12 colleges and the Cooperation Zone campus eight, including three postgraduate colleges on each campus.\n\nThe proposed postgraduate colleges will be developed around the themes ‘Innovation and Interdisciplinary Exchange’, ‘Research Excellence’ and ‘Global Engagement’. They will serve groups including doctoral researchers, international and exchange students, and students from relevant research institutes. Core curriculum modules and signature activities will support research, innovation, internationalisation and student development."],["Hengqin Campus and One University, Two Campuses","The new Cooperation Zone campus is projected to begin partial operations in 2028, be fully completed in 2029 and enter a phase of expansion and refinement in 2030. This construction timetable is distinct from the existing first-phase arrangements already supporting cross-border teaching.\n\nUM will implement an integrated ‘One University, Two Campuses’ management model, ensuring consistency in institutional governance, operations, student education and academic qualifications while complying with the legal requirements of both jurisdictions.\n\nA management committee and operational entity will be established in the Cooperation Zone, with corresponding offices of main-campus functional units supporting integrated operations."],["N.E.T. Research Strategy","UM will move beyond its earlier ‘Four Threes’ research structure by adopting the N.E.T. strategy, integrating interdisciplinary research and an ‘AI+’ approach.\n\nN — Nurturing Cores: Strengthen the three State Key Laboratories in Chinese Medicine, Microelectronics and Internet of Things for Smart City, developing a coordinated ‘Laboratory + Research Institute’ structure.\n\nE — Enabling Ecosystem: Develop research clusters and platforms in artificial intelligence and brain sciences, biomedical sciences and clinical translation, intelligent medical engineering, and energy and carbon neutrality.\n\nT — Threading Networks: Link research capabilities across the two campuses with the needs of industries and markets in the Greater Bay Area, creating an open regional innovation network."],["Cross-Border Data and Digital Administration","UM will develop dedicated network connections between its campuses, enhance secure access to international internet and research networks, and establish trusted mechanisms for cross-border data exchange.\n\nThe plan includes phased upgrades to the University's core information systems, the intelligent development of the UM App and implementation of the UM Flow office automation platform to strengthen cross-departmental coordination.\n\nPriority will also be given to a transcript verification service for postgraduate admission applications, including authentication via the China Higher Education Student Information system and mutual recognition among Greater Bay Area institutions. Cross-border data security assessments and emergency response mechanisms will accompany these initiatives."],["Sustainable Development Goals and International Cooperation","UM will incorporate the United Nations Sustainable Development Goals (SDGs) into its overall strategy and consider establishing a university-level sustainability body to coordinate education, research, campus management, public services and international cooperation.\n\nResearch priorities include human health and well-being, smart city development and environmental protection. In partnership with governments, enterprises, international organisations and global alliances, UM will promote sustainable development, green campus initiatives, ESG governance and broader social responsibility. Cross-border collaboration between Macao and Hengqin forms part of this approach."]]};
const escapeHTML=text=>String(text).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const escapeAndParagraphs=text=>String(text).split(/\n\n+/).map(part=>'<p>'+escapeHTML(part)+'</p>').join('');
let mode=['interview','zh','en'].includes(location.hash.slice(1))?location.hash.slice(1):'interview';
function render(){
 document.documentElement.lang=mode==='en'?'en':'zh-Hant';
 for(const button of document.querySelectorAll('nav button'))button.setAttribute('aria-selected',String(button.dataset.mode===mode));
 const container=document.getElementById('content');
 if(mode==='interview'){
  container.innerHTML=DATA.interview.map(group=>'<section class="topic"><h2>'+escapeHTML(group[0])+'</h2>'+
   group[1].map(item=>'<details><summary>'+escapeHTML(item[0])+'</summary><article>'+escapeAndParagraphs(item[1])+'</article></details>').join('')+'</section>').join('');
 }else{
  container.innerHTML=DATA[mode].map(item=>'<details><summary>'+escapeHTML(item[0])+'</summary><article>'+escapeAndParagraphs(item[1])+'</article></details>').join('');
 }
}
for(const button of document.querySelectorAll('nav button')){
 button.addEventListener('click',()=>{mode=button.dataset.mode;history.replaceState(null,'','#'+mode);render();});
}
window.addEventListener('hashchange',()=>{const found=location.hash.slice(1);mode=['interview','zh','en'].includes(found)?found:'interview';render();});
render();
</script>
</body>
</html>
