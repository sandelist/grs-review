<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAO 面試準備</title><style>:root{color-scheme:dark;--bg:#002c55;--gold:#ffd446;--line:#ffffff40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;line-height:1.7}.wrap{max-width:900px;margin:auto;padding:24px 18px 70px}h1{font-size:24px;margin:0 0 8px}p.sub{font-size:13px;color:#ffffffad;margin:0 0 22px}nav{display:flex;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:20px}nav button{border:1px solid var(--line);background:transparent;color:#fff;padding:10px 16px;font:inherit;border-radius:4px;cursor:pointer}nav button[aria-selected=true]{border-color:var(--gold);color:var(--gold)}h2{font-size:18px;margin:22px 0 12px}details{border:1px solid var(--line);border-radius:5px;margin-bottom:10px;overflow:hidden}summary{padding:16px 15px;cursor:pointer;font-weight:600}article{padding:0 15px 18px;border-top:1px solid var(--line)}article h3{font-size:13px;color:var(--gold);margin:16px 0 4px}article p{margin:0;white-space:pre-line}small{color:#ffffffb3}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions button{background:transparent;border:1px solid var(--line);color:#fff;padding:7px 12px;border-radius:4px;cursor:pointer}input{background:#ffffff13;border:1px solid var(--line);color:#fff;border-radius:4px;padding:11px;width:100%;font:inherit;margin-bottom:12px}input::placeholder{color:#ffffff9c}.tag{font-size:12px;color:var(--gold);margin-right:9px}@media(max-width:500px){h1{font-size:21px}.wrap{padding:19px 13px}summary{padding:14px 12px}}@media print{body{background:white;color:black}nav,input,.actions button{display:none}details{border:1px solid #aaa}article{display:block!important}.tag,article h3{color:#333}}</style></head><body><main class="wrap"><h1>GAO 面試準備</h1><p class="sub">個人準備筆記 · 非澳大官方面試資料 · 內容仍須按實際經歷及最新規劃核實</p><nav><button id="interview" aria-selected="true">面試思考</button><button id="plan" aria-selected="false">五年規劃</button></nav><div class="actions"><h2 id="heading">面試思考</h2><button id="toggle">全部展開</button></div><input id="filter" placeholder="搜尋問題或關鍵字" aria-label="搜尋內容"><section id="items"></section></main><script>const data={"groups":[["動機與定位","為何申請GAO？","把國際事務學術背景、在澳大接觸國際化工作的經歷，以及實際參與大學交流活動連成一條線；不是泛泛說喜歡大學。","SOAS國際研究與外交碩士；聯合國開發計劃署北京實習；澳大國際合作專題採訪與寫作；曾參與南京及北京的大學交流活動。","不要宣稱曾負責國際合作協議談判。"],["動機與定位","為何離開澳大，又希望回澳大？","當年轉到金沙中國，是希望接觸大型企業的溝通及跨部門工作；現在希望把兩種環境累積的經驗用於國際高等教育行政。","2018至2025年在澳大傳訊部；2025年2月起任金沙中國人力資源傳訊經理。","需要以本人具體的金沙工作成果補充，不能虛構。"],["動機與定位","為何是全球事務辦公室，而非傳訊部？","說明興趣由『介紹國際合作』延伸至『協助合作項目落實』，重點在聯絡、資料核實、協調、跟進。","曾撰寫三篇與澳大國際化、全球合作及葡萄牙高校聯繫有關的專題。","熟悉GAO工作不等於具備所有專門業務經驗。"],["經歷與能力","用一分鐘介紹自己","學歷背景→澳大六年半→金沙中國近兩年→申請GAO的原因。重點突出跨文化理解、雙語溝通、協調與準確性。","澳大傳播學學士、SOAS碩士、倫敦大學數據科學與人工智能碩士；UNDP實習。","英文或中文自我介紹都應用自然口語，不必背誦長段落。"],["經歷與能力","最能證明你了解澳大國際化的工作？","選2019、2024或2025年的專題，說明如何訪問、核實資料、把策略轉化為可理解內容。","2019〈全球策略提升國際聲譽〉；2024〈遷校十年 揚帆千里：拓展全球合作網絡〉；2025〈澳大與葡萄牙高校的結緣〉。","2019專題由本人主要撰寫；2024及2025為核心作者之一。"],["經歷與能力","說一個跨部門協調例子","先講目標與參與單位，再講協調難點、自己的具體行動及可核實的結果。","2020年協調十多個部門的大學網站模板升級；2023年虛擬校園導覽；年度大學簡介資料收集。","不要把參與說成單獨領導。"],["經歷與能力","有沒有實際組織校外交流的經驗？","描述校園記者、傳訊職員的大學參訪安排；說明接待、行程、跨校聯繫如何轉移至GAO工作。","曾參與赴廣州、北京、杭州、南京的交流策劃；親身參與中國傳媒大學及南京大學交流；安排校園記者參訪澳廣視及澳門日報。","具體負責哪些邀請、預算、行程環節，面試前須再核實。"],["經歷與能力","金沙中國的工作有何可轉移能力？","以大型企業內部傳訊的準確、時效、跨部門協作、對不同受眾調整語氣等為框架，加入真正親自負責的案例。","可能使用TRUE CARE刊物、myPRIZE、NBA中國賽員工傳訊或年度頒獎等項目，但具體職責尚待本人確認。","這是面試重要部分，目前證據仍需補充。"],["國際事務","怎樣處理海外大學提出合作建議？","先了解目的與範圍、核實對口學術單位和審批程序、安排溝通、記錄責任與期限；不作超越權限的承諾。","UNDP研究背景、澳大國際合作專題和實際交流策劃可支持理解能力。","不可自行保證簽署協議、獎學金或名額。"],["國際事務","如何推動葡語國家及其他海外夥伴合作？","由學科互補、師生交流、共同研究、短期課程和學術活動入手，重視合作是否產生實際成果。","SOAS論文研究澳門在中國與葡語非洲國家關係中的平台角色；曾翻譯澳門葡裔相關著作。","避免誇大澳門在外交談判中的實際角色。"],["情境應對","合作院校要求即時確認未獲批安排","先清楚區分已批准與待確認資訊；向主管及相關單位核實；對外禮貌回覆並提供預期跟進方式。","以資料準確及審批界限為核心。","切勿承諾錄取、資助、課程開設或簽約。"],["情境應對","海外代表團臨時更改行程","確認必須保留的核心會議，聯繫接待單位、交通、場地與翻譯；通知各方並更新行程表。","可連結過往大學參訪與跨部門協調經驗。","不要杜撰曾經處理過的突發事件。"],["情境應對","如何處理合作統計數字不一致？","先核對定義、統計期間、資料來源與更新日期，再向資料擁有人確認；留下版本記錄。","具備數據科學與人工智能碩士背景。","學位不能代替實際數據治理經驗。"],["個人特質","你最大的不足是甚麼？","坦誠指出尚未直接負責GAO協議審批或國際合作專案全流程，但具備相關背景，會主動學習制度及流程。","熟悉澳大行政環境及國際化內容。","避免把缺乏直接經驗說成完全沒有學習成本。"],["個人特質","對薪酬、穩定性及長遠發展的看法","以職務匹配、可持續投入與長期發展為重點；如被問到薪酬，坦誠但不必主動把『較輕鬆』當作理由。","曾在大學與企業兩種環境工作。","具體薪酬期望按招聘條件回答。"]],"plan":[["R.E.A.C.H.發展框架","Resource-integrated；Excellence-focused；Ambition-led；Collaboration-centric；High-impact。","面試可把資源整合、國際協作及可衡量成果與GAO行政工作連結；不要把它當成GAO獨立部門KPI。"],["四個國際化維度","國際化師資、國際化課程、國際學生、國際交流。","討論GAO如何支援海外院校關係、交流機會及資訊協調，並承認招生與課程權限屬不同單位。"],["合作地區與夥伴","葡語、英語、西語國家；『一帶一路』沿線、亞太周邊地區；中國內地重點高校及C9+。","把合作視為學術互補與人員交流，不要只追求協議數量。"],["一校兩區與橫琴","橫琴粵澳深度合作區校區預期2028年局部投入使用、2029年全面運作。","談跨校區活動、國際學生支援、接待及資訊一致性時，注意區分現有過渡辦學點與新校區。"],["學生規模與研究生教育","2030/31學年學生總數目標超過22,000人；研究生教育與高水平科研、全球合作及人才培養相連。","不應把全校學生規模目標錯說成研究生人數目標。"],["科研及學科發展","重點包括國家重點實驗室、人工智能與腦科學、生物醫學與臨床轉化、智能醫療工程、能源與碳中和。","國際合作可支援聯合研究、人才交流及跨學科網絡；具體計劃需以官方最新資料核實。"],["全球合作的實際成效","除了合作協議，亦要關注學生與教師流動、共同研究、交流活動、合作計劃執行及資料品質。","可在面試提出『合作有沒有帶來實際交流和學術成果』，但不要捏造規劃的官方指標。"]]};let mode=location.hash==='#plan'?'plan':'interview';const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const isPlan=mode==='plan';$('interview').setAttribute('aria-selected',String(!isPlan));$('plan').setAttribute('aria-selected',String(isPlan));$('heading').textContent=isPlan?'五年規劃':'面試思考';const search=$('filter').value.trim().toLowerCase();const rows=isPlan?data.plan:data.groups;const result=rows.filter(row=>row.join(' ').toLowerCase().includes(search));$('items').innerHTML=result.map(row=>isPlan?'<details><summary>'+escape(row[0])+'</summary><article><h3>規劃重點</h3><p>'+escape(row[1])+'</p><h3>面試連結</h3><p>'+escape(row[2])+'</p></article></details>':'<details><summary><span class="tag">'+escape(row[0])+'</span>'+escape(row[1])+'</summary><article><h3>建議答題方向</h3><p>'+escape(row[2])+'</p><h3>可用的真實經歷</h3><p>'+escape(row[3])+'</p><h3>注意</h3><p>'+escape(row[4])+'</p></article></details>').join('')||'<p>沒有符合的內容。</p>';$('toggle').textContent='全部展開';}for(const id of ['interview','plan'])$(id).onclick=()=>{mode=id==='plan'?'plan':'interview';history.replaceState(null,'','#'+mode);render();};$('filter').oninput=render;$('toggle').onclick=()=>{const d=[...document.querySelectorAll('details')],expand=d.some(x=>!x.open);d.forEach(x=>x.open=expand);$('toggle').textContent=expand?'全部收起':'全部展開';};render();</script></body></html>
