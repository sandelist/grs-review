<head>

<style>
:root { --blue:#002C55;--white:#fff;--gold:#FFD446;--line:rgba(255,255,255,.26);--soft:rgba(255,255,255,.78) }
* { box-sizing:border-box }
html { scroll-behavior:smooth }
body { margin:0;min-height:100vh;background:var(--blue);color:var(--white);font:16px/1.85 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;-webkit-font-smoothing:antialiased }
button { cursor:pointer;font:inherit }
.page { max-width:970px;margin:0 auto;padding:0 26px }
nav { display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(98px,1.6fr);border-bottom:1px solid var(--line);margin-top:22px }
.tab { position:relative;border:0;background:none;color:var(--soft);padding:15px 5px 19px;white-space:nowrap;font-size:17px;line-height:1.4 }
.tab[aria-selected="true"] { color:var(--white);font-weight:690 }
.tab[aria-selected="true"]::after { content:"";position:absolute;left:28%;right:28%;bottom:-1px;height:2px;background:var(--gold) }
button:focus-visible,summary:focus-visible { outline:2px solid var(--gold);outline-offset:3px }
main { padding-top:32px;padding-bottom:84px }
.top { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px }
h1 { margin:0;font-size:24px;font-weight:690;letter-spacing:.015em;line-height:1.35 }
.action { color:var(--white);background:transparent;border:1px solid var(--line);font-size:13px;padding:9px 13px;white-space:nowrap }
#content { border-bottom:1px solid var(--line) }
details { border-top:1px solid var(--line) }
summary { list-style:none;display:flex;align-items:center;gap:14px;cursor:pointer;padding:19px 2px }
summary::-webkit-details-marker { display:none }
.index { font-weight:700;font-variant-numeric:tabular-nums;min-width:55px;line-height:1.3 }
.name { flex:1;font-weight:625;line-height:1.45;min-width:0;overflow-wrap:anywhere }
.name-en { display:block;font-size:13px;font-weight:440;color:var(--soft);line-height:1.5;margin-top:3px }
.arrow { font-size:18px;line-height:1.1;color:var(--soft);transition:transform .16s ease }
details[open] .arrow { transform:rotate(180deg) }
.answer-area { padding:0 6px 30px 73px }
.block + .block { margin-top:25px }
.label { color:var(--soft);font-size:12px;font-weight:640;margin-bottom:7px }
.question,.model,.context { overflow-wrap:anywhere;white-space:pre-line;line-height:1.85;font-size:15px }
.context { color:var(--soft);margin:0 0 12px;font-size:14px }
.model { line-height:1.92 }
.data { border-collapse:collapse;margin-top:13px;width:100%;font-size:14px;line-height:1.55 }
.data td { border:1px solid var(--line);padding:8px 10px;vertical-align:top }
.data tr:first-child { font-weight:650 }
.plan-cols { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:27px }
.plan-copy { font-size:15px;line-height:1.88;white-space:pre-line;overflow-wrap:anywhere }
.plan-copy[lang="en"] { line-height:1.85 }
.plan-card .answer-area { padding-left:6px }
@media(max-width:700px) { .page{padding:0 18px} .plan-cols{grid-template-columns:1fr;gap:20px} .plan-copy {font-size:15px} }
@media(max-width:520px) {
 .page { padding:0 14px }
 nav { margin-top:12px;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(75px,1.6fr) }
 .tab { font-size:14px;padding:14px 1px 17px }
 main { padding-top:22px;padding-bottom:48px }
 h1 { font-size:20px }
 .top { margin-bottom:14px }
 summary { gap:8px;padding:16px 0 }
 .index { min-width:49px;font-size:15px }
 .name { font-size:15px }
 .name-en { font-size:12px }
 .answer-area { padding:0 2px 24px 0 }
 .question,.model,.plan-copy { font-size:14px }
 .context { font-size:13px }
 .data { font-size:12px }
 .data td { padding:7px 5px }
 .action { padding:7px 9px;font-size:12px }
}
@media print {body{background:#fff;color:#000}.tab,.action,.arrow{display:none}details>.answer-area{display:block!important}.page{max-width:none}summary{color:#000}nav{display:none} .label,.context{color:#444}details{break-inside:avoid}}

<script>
const PAPERS=[{"id":"A","score":55,"name":"招生與現場應變","items":[{"id":"A1","title":"跨校區招生與服務","lang":"中文","question":"澳大正推進五年發展規劃及研究生教育。部分研究生已在橫琴過渡期辦學點上課或研究，亦已有學生在當地住宿；這不等於新合作區校區已全面建成。\n\n假設研究生院須在現有人手及預算下，協助增加合資格研究生申請及最終入學人數，同時維持主校區和橫琴辦學點的服務質素。作為行政人員，你認為最需要處理哪三項行政挑戰？請逐項說明其影響及可行措施，列明主要協作單位，並解釋你會優先處理哪一項。最後提出兩項可量度指標：一項反映招生或入學成效，另一項反映服務或資訊質素。\n\n毋須假設兩地所有程序都不同，也毋須背誦具體出入境法規或內部KPI；重點是說明哪些事項需要核實、如何協調及跟進。","model":"澳大要擴大研究生招生，同時維持澳門與橫琴的服務質素。我會優先處理三項挑戰。\n\n第一，資訊與規則未必清晰。兩地上課、住宿、申請資格及個人資料處理涉及不同安排，錯誤資訊可能影響學生決定。我會與學院、招生部門及相關行政單位核對最新資料，使用統一的雙語指引，並按規定處理個人資料。\n\n第二，人手有限而查詢增加。我會與研究生院同事分類處理查詢，優先跟進臨近截止日期及有較大風險的個案。常見問題可使用已核准的回覆範本或獲批准的數碼工具，但不應自動決定取錄或資助。\n\n第三，跨校區支援需要協調。我會與學生事務、住宿、交通及學術單位確認服務安排，指定同事跟進未解問題，確保學生不會被反覆轉介。\n\n我會先處理可能誤導申請人的資訊，因為影響最直接。成效可用同一招生周期的合資格申請人數，以及在指定時限內獲實質回覆的查詢比例衡量。"},{"id":"A2(a)","title":"Pre-event preparation","lang":"English","question":"Identify five essential pre-event checks. For each, name the person or team you would involve. Cover programme information and materials, speakers and duties, and the practical arrangements for running the sessions.","context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding.","model":"1. Confirm programme facts and the latest slides with academic units.\n2. Confirm speakers, timing and question-handling duties with GRS and the host.\n3. Test the connection, sound and backup equipment with IT staff.\n4. Prepare approved FAQs and referral contacts with GRS.\n5. Agree on session changes, announcements and emergency contacts with Communications."},{"id":"A2(b)","title":"Speaker loses connection","lang":"English","question":"Five minutes into the second session, the speaker loses the connection. A backup slide deck is available, but the reconnection time is unknown. Explain your immediate response and how you would protect the remaining programme and inform participants.","context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding.","model":"I would tell viewers about the connection problem and ask IT staff to help the speaker reconnect. Meanwhile, the host could use the approved backup slides. With the coordinator’s agreement, another prepared speaker could speak first. I would protect the next session’s starting time, explain any change to viewers and record unanswered questions for follow-up."},{"id":"A2(c)","title":"Outdated slide","lang":"English","question":"A reused slide states that all teaching is on the main campus and that every successful applicant receives a full scholarship. The current approved programme information does not support either statement. Viewers have already seen the slide. What would you do during the session and afterwards?","context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding.","model":"I would stop using the slide and inform the host and academic representative. We should clearly correct both claims using approved information: teaching locations depend on programmes, and scholarships are not guaranteed to everyone. We should also post the correction in the chat. Afterwards, I would update the slides, FAQs and recording, and inform affected viewers if possible."},{"id":"A2(d)","title":"Privacy in a public chat","lang":"English","question":"An applicant posts a passport image and examination results in the public chat and asks staff to guarantee admission and a Hengqin room immediately. Explain how you would protect the applicant while providing a useful response and arranging follow-up.","context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding.","model":"I would ask the moderator to hide the passport image and examination results immediately. I would direct the applicant to an approved private channel and ask other viewers not to share the documents. GRS could explain the application and housing processes, but cannot guarantee admission or a room. A named officer would follow up with the relevant teams and handle the privacy incident under university rules."},{"id":"A3","title":"AI in admissions administration","lang":"English","question":"Following the livestreams, GRS has approved programme information, chat records containing personal details, unanswered enquiries and participation figures. A colleague proposes uploading all records to a free public AI tool to generate replies automatically.\n\nDesign a safer workflow. State three useful AI applications and three specific safeguards, and identify who should check and authorise applicant-facing outputs. Explain how unresolved academic or admissions questions would be handled rather than automatically answered.\n\nNo product names or programming knowledge are required. Your response should explain a workable division between AI assistance and human responsibility.","model":"I would not upload raw chat records to a free public AI tool. Approved AI could help us: (1) group similar questions, (2) draft replies using approved programme information, and (3) summarise participation data.\n\nWe should remove personal details, use only approved systems with limited access, and check all facts before use. GRS staff should review replies, academic units should check programme details, and an authorised officer should approve messages before sending them.\n\nQuestions about admission, funding or unclear academic rules should go to the responsible staff. Each case needs a named officer and a reply deadline. AI must not make decisions or send unchecked answers."}]},{"id":"B","score":63,"name":"個人經驗與發展","items":[{"id":"B1","title":"經驗如何支持研究生院","lang":"中文","question":"在你過去的學習及工作經歷中，哪一段經歷最有助你勝任澳門大學研究生院的行政工作？\n\n請以兩個真實工作或學習例子，說明你採取的行動、取得的結果或所得的經驗，再歸納三項可轉用於研究生院的能力。其應用須同時涉及招生推廣及至少一項非宣傳的研究生院工作，並考慮主校區與橫琴辦學點的需要。\n\n最後指出一項你仍需補足的研究生行政知識，以及入職後如何有系統地學習。\n\n不要求曾經做過研究生招生或學籍工作。只採用自己的真實經驗；不能量化的成果，可用已完成的工作、問題改善或回饋說明，不必虛構數字。","model":"我曾在澳門大學傳訊部工作，其中校園記者計劃的經驗最能幫助我勝任研究生院的行政工作。\n\n第一個例子是組織及支援校園記者培訓。我參與工作坊、編採會議和相關活動的統籌，並協助學生改善文章。這讓我學會清楚溝通、理解學生需要，以及與不同同事協作。這些能力可用於研究生招生講座、資訊發布及學生支援。\n\n第二個例子是處理每年約二三百份校園記者申請。我需要整理申請資料、分類及核對紀錄，方便團隊進一步審視。這讓我重視數據準確、資料保密和按一致標準處理個案，可應用於研究生招生及學籍行政。\n\n我可帶來三項能力：一是將複雜資訊寫得清楚；二是有條理地整理和核實資料；三是跨部門協調與跟進。對澳門及橫琴的學生，我會向相關單位確認課程、住宿和支援安排，避免發出互相矛盾的訊息。\n\n我仍需學習研究生學籍、論文程序及資助規定。入職後，我會研讀正式指引、向資深同事請教，並親自測試申請流程，逐步建立可靠的工作清單。"},{"id":"B2","title":"Three priorities for the year","lang":"English","question":"UM’s Five-Year Development Plan places postgraduate education within the development of an international comprehensive research university. It combines growth and international cooperation with stronger education and quality assurance. Postgraduate teaching, research and residential life are already taking place at transitional sites in Hengqin.\n\nWith limited staff and resources, what three priorities would you recommend for the Graduate School over the next twelve months? At least one should address recruitment and at least one should address the experience, academic progress or development of enrolled postgraduate students. The third is your choice.\n\nFor each priority, explain why it matters, propose practical actions, identify the main partners and give one measurable outcome. Relate your recommendations to UM’s five-year direction and the needs of students across Macao and Hengqin. Conclude by explaining how you would prioritise resources without sacrificing fairness or educational quality.\n\nYou may build on existing activities, including mainland recruitment, online briefings, international outreach and academic support. Do not assume these activities are absent. No particular combination of initiatives is the only correct answer; marks reward justified choices and workable execution. You are not required to invent institutional targets.","model":"UM’s Five-Year Development Plan calls for growth, international cooperation and better postgraduate education. I would focus on three priorities.\n\n1. Improve recruitment through student experience.\nGRS could work with academic units, residential colleges and Communications to hold online sessions for applicants. Current students could explain postgraduate study, research life and support in Macao and Hengqin. We should provide approved information, explain confirmed teaching locations and avoid promising unconfirmed benefits. We should also make sessions accessible to applicants based overseas. I would track eligible applications and registrations, not only event views.\n\n2. Support international learning for current students.\nGRS could work with the Global Affairs Office, supervisors and academic units to share clear information on research exchanges and short visits. We should explain eligibility, funding and approval steps, and offer support before and after each visit. I would measure participation and collect student feedback.\n\n3. Explore joint postgraduate programmes.\nGRS and academic units could identify suitable overseas partners and examine academic fit, supervision, credit or degree rules, and student support. We should begin with a small, feasible proposal rather than promise a new degree immediately. Progress could be measured by proposals reviewed and agreements approved.\n\nI would start with the online student sessions because they need fewer resources. At the same time, I would improve support for enrolled students and study joint programmes carefully. All decisions must follow academic standards, fair access and proper approval."}]},{"id":"C","score":67,"name":"學生服務與數據","items":[{"id":"C1","title":"橫琴博士生複合查詢","lang":"中文","question":"模擬情境：一名博士生部分教研活動在橫琴辦學點進行，並已入住當地學生公寓。他向研究生院反映，兩份通知列出的進度報告期限不同，導師尚未回覆其查詢，他擔心影響資助；另外，他對下週主校區活動的交通安排及可使用的支援服務感到不清楚。\n\n你是首先收到查詢的研究生院行政人員。請提出有先後次序的處理方案，涵蓋即時回應、期限及進度程序核實、與導師／學院及相關行政單位的協調、生活與跨校區資訊，以及後續跟進。\n\n說明哪些事項可由你直接協助，哪些須經相關單位確認或批准。不得僅把學生轉介後便結束，也不得自行延長期限或裁定其資助結果。\n\n題目未提供學生所屬資助計劃或最終適用期限；不要求猜測。毋須引用條文編號，也不應把另一校區當作另一所大學。","model":"我會先回覆學生，確認其課程、兩份通知及資助計劃，並優先處理最接近的進度報告期限，以免學生因資訊衝突而受影響。\n\n我會向研究生院及學院核對兩份通知的適用對象、報告階段及正式期限，並協助聯絡導師及課程負責人，確認學生應提交甚麼資料。我可以解釋已核實的程序及協助轉交查詢，但不能自行延長期限或決定資助結果。如期限緊迫，應立即向有權限的主管反映。\n\n關於橫琴住宿及主校區活動，我會向學生事務、辦學點及活動單位確認交通、活動地點和可用支援，再向學生提供清楚的安排。\n\n我會記錄各項問題、負責人及回覆時間，持續跟進至得到結果；即使暫未解決，也要按約定更新學生。所有個人資料只向有需要的相關人員提供。"},{"id":"C2(a)","title":"Two-university recruitment itinerary","lang":"English","question":"Propose a realistic programme from 09:30 to 16:30, preserving both briefings and allowing preparation, lunch, transfers and a reasonable buffer. State the main recruitment purpose in one sentence. Do not add unrelated visits.","context":"Hypothetical scenario: a GRS team and academic representatives are already in Zhuhai for two university recruitment briefings. University A’s session is fixed at 10:00–11:00 and University B’s at 14:00–15:00. Transfer from A to B takes 45 minutes; travel from B to the departure border checkpoint takes 60 minutes. The team must reach that checkpoint by 16:30. A working lunch and preparation time are needed.","model":"09:30–10:00  Check slides, equipment and the briefing plan at University A.\n10:00–11:00  Recruitment briefing at University A.\n11:00–14:00  Travel to University B (45 minutes), have a working lunch, prepare and allow time for delays.\n14:00–15:00  Recruitment briefing at University B.\n15:00–16:00  Travel to the border checkpoint (60 minutes), arriving 30 minutes before the deadline.\n\nPurpose: To introduce UM postgraduate programmes and help suitable students understand how to apply."},{"id":"C2(b)","title":"Pre-visit checks","lang":"English","question":"State three grouped preparation checks. Cover (i) the agreed agenda, speakers and approved materials; (ii) transport and travel-document arrangements; and (iii) meal timing, numbers and dietary requirements. Name the relevant contacts or responsible parties, and include a backup for one critical arrangement.","context":"Hypothetical scenario: a GRS team and academic representatives are already in Zhuhai for two university recruitment briefings. University A’s session is fixed at 10:00–11:00 and University B’s at 14:00–15:00. Transfer from A to B takes 45 minutes; travel from B to the departure border checkpoint takes 60 minutes. The team must reach that checkpoint by 16:30. A working lunch and preparation time are needed.","model":"1. Programme: Confirm the agenda, speakers and approved slides with both host universities and the academic representatives.\n2. Transport: Confirm the route and travel time with the driver, and remind all staff to bring valid travel documents. Arrange a backup driver or transport contact.\n3. Meals: Confirm the lunch time, number of people and dietary needs with the host or restaurant."},{"id":"C3(a)","title":"Postgraduate recruitment announcement","lang":"English","question":"Use only this hypothetical fact sheet to write a short recruitment announcement for UM’s website (100–120 words including the headline). Do not add a URL or hashtags. Include a clear headline, relevant benefits for prospective postgraduate students and a specific next step. Do not invent course titles, rankings, speakers, quotations or confirmed benefits.","extra":[["Event","Postgraduate Study at UM: Information Session"],["When / format","5 November 2026, 19:00–20:00, Beijing/Macao time; online, in Mandarin"],["Speakers / topics","GRS and academic representatives; artificial intelligence, engineering and design; applications, research opportunities and study arrangements across Macao and Hengqin"],["Attendance","Free; register through UM’s official event registration page by 17:00 on 3 November"],["Limits","Teaching location depends on the programme and confirmed arrangements. No guaranteed admission, scholarship or accommodation is announced."]],"model":"Explore Postgraduate Study at UM\n\nInterested in postgraduate study at the University of Macau? Join our free online information session on 5 November 2026, from 19:00 to 20:00 (Beijing/Macao time). The session will be held in Mandarin.\n\nRepresentatives from the Graduate School and academic units will introduce postgraduate study in artificial intelligence, engineering and design. They will also explain applications, research opportunities and study arrangements in Macao and Hengqin. You can learn more about the available options and prepare questions before applying.\n\nTeaching locations depend on each programme and confirmed arrangements. Admission, scholarships and accommodation are not guaranteed.\n\nPlease register through UM’s official event registration page by 17:00 on 3 November 2026."},{"id":"C3(b)","title":"Reply to a conditional-offer applicant","lang":"English","question":"Today is 6 November in this hypothetical case. An applicant’s conditional offer requires a final transcript by 10 November through the official system, but their current university says it can issue it only on 18 November. The applicant asks you to approve an extension and confirm funding and accommodation, neither of which has been individually confirmed. Draft a helpful email reply explaining the next steps and what remains subject to confirmation. You may not approve exceptions yourself.","model":"Dear Applicant,\n\nThank you for informing us. We understand that your university cannot issue your final transcript until 18 November.\n\nYour conditional offer currently requires you to submit the transcript through the official system by 10 November. Please send us written confirmation of the delay from your university as soon as possible, preferably before 10 November. We will refer your request to the authorised team for review. An extension is not confirmed unless that team approves it.\n\nFunding and accommodation also depend on separate decisions, so we cannot guarantee either at this stage.\n\nWe will update you when we receive a decision. Please use the official application channel for any personal documents.\n\nBest regards,\nGraduate School"},{"id":"C4","title":"招生推廣數據","lang":"中文","question":"以下均為模擬數據：兩個已完成的招生推廣組別採用相同統計定義及同樣的觀察期。各組內已去除重複人士，已完成申請及符合基本資格的申請均可追溯至該組參與者。組別並非隨機分配，尚無錄取或註冊結果。\n\n(a) 分別計算甲、乙兩組的「完成申請／參與者」比例，以及「符合基本資格／完成申請」比例。\n(b) 有人說：「乙組參與者較多，所以招生一定更成功。」你是否同意？用數據說明，並指出一項比較限制。\n(c) 提出一項可跟進的改善措施及一項後續成效指標。不要把符合基本資格等同獲錄取。","extra":[["組別","獨立參與者","完成申請","符合基本資格的申請"],["甲","400","40","30"],["乙","800","48","24"]],"model":"甲組：完成申請率＝40 ÷ 400＝10%；合資格比例＝30 ÷ 40＝75%。\n乙組：完成申請率＝48 ÷ 800＝6%；合資格比例＝24 ÷ 48＝50%。\n\n我不同意「乙組參與者較多，所以招生一定更成功」。乙組雖有800人參與，甲組的完成申請率較高，合資格申請亦較多（30宗對24宗）。而且兩組並非隨機分配，不能把差異完全歸因於宣傳效果；目前亦沒有錄取或註冊數據。\n\n改善方面，我會在活動中更清楚講解申請資格及文件要求，並提供易用的申請指引。後續以同一招生周期的「合資格申請／完成申請」比例追蹤成效，再觀察最終註冊結果。"}]},{"id":"D","score":69,"name":"國際研究與資料核實","items":[{"id":"D1","title":"個人經驗與研究生支援","lang":"中文","question":"請從你親身的研究生學習或專業服務經驗中，選擇一項值得借鑑的做法，說明如何把它適當地應用於澳門大學的研究生支援。","model":"我曾在利物浦大學修讀網上研究生課程，需要使用網上圖書館服務Libby，但當時遇到問題，便發電郵向大學學生支援團隊查詢。約一個工作天後，我收到有禮而清楚的回覆。對方解釋網上學生可以使用的服務，並把技術問題轉介資訊科技部門。問題很快得到處理，也減輕了我的焦慮。\n\n這段經驗讓我明白，好的學生服務不只是把問題轉交出去，而是先理解學生的困難，提供準確資訊，再跟進至問題解決。\n\n我希望將這種做法用於澳大研究生院。例如，來自不同地方、在澳門或橫琴學習的研究生，可能對課程安排、學籍、住宿或網上資源有不同疑問。收到查詢後，我會先確認學生需要，核對規定，盡快給予清楚回覆；超出自己權限的事項則聯絡相關部門，並持續跟進。\n\n我不會隨便承諾資助、宿位或學術結果，但會讓學生知道誰在處理、下一步是甚麼，以及何時再收到消息。"},{"id":"D2","title":"International postgraduate support research","lang":"English","question":"The Dean asks you to investigate how overseas universities support international postgraduate students during their first semester. Explain how you would conduct this study and use its findings to advise UM.","model":"I would first choose a small group of overseas universities with student groups and study programmes similar to UM’s. Rankings may be a starting point, but I would not select universities by ranking alone.\n\nI would compare first-semester support in the same areas: arrival and orientation, course advice, academic guidance, accommodation, funding and mental health services. I would review official websites and student guides, then look for student feedback or service reports to see how well the support works. I could use Excel to organise the findings and approved AI tools to help find public information, but I would check the sources myself.\n\nI would present a short comparison to the Dean, showing useful practices, costs and possible limits. I would recommend a few actions that UM could test, such as a clearer welcome guide or a named contact for new international postgraduates, and collect feedback after the trial."},{"id":"D3","title":"Verification of doctoral degree data","lang":"English","question":"UM's Rector's Office is preparing postgraduate data for a university-level ranking submission and asks GRS to confirm the number of doctoral degrees formally awarded in calendar year 2025. GRS's approved degree-award register records 186 such awards, while a spreadsheet from academic units lists 211 students who completed doctoral requirements during academic year 2024/25. Your GRS supervisor asks you to examine the two records before any official response is sent to the Rector's Office. How would you establish and document the appropriate figure for your supervisor?","model":"The request is for doctoral degrees formally awarded in calendar year 2025. GRS’s approved register records 186 such awards. The other figure, 211, covers students who completed doctoral requirements in academic year 2024/25. It uses a different period and counts a different event. The two figures should not be treated as the same.\n\nI would first check the approved register, award dates, student records and any later corrections. I would confirm the reporting definition and check any unclear cases with the responsible records team and academic units. I would not change the figure simply to match 211.\n\nI would prepare a short record for my supervisor showing the verified figure, source, reporting period, checks completed and any issues still open. After approval, GRS could send the confirmed data to the Rector’s Office."}]}];
const PLAN=[{"id":"01","title":"研究生教育方向","titleEn":"Postgraduate education strategy","cn":"研究生教育水平決定一流大學的辦學格局，更是大學深度融入區域經濟社會發展、全球創新網絡、貢獻人類知識前沿的重要路徑。因應全球對國際化創新人才的迫切需求，澳大將以全球融合、卓越發展為引領，以深化國際合作、優化培養體系、強化質量保障為重點，推進研究生教育國際化進程， 並持續提升研究生培養水平。","en":"Postgraduate education determines the overall academic standing of a first-class university and is its primary channel for contributing to regional economic and social development, global innovation networks and the advancement of knowledge. In response to global demand for internationally oriented and innovation-driven talent, the University will be guided by its commitment to global connection and pursuit of excellence, while placing emphasis on enhancing international cooperation and on strengthening education and quality assurance systems. This aims to promote the internationalisation and quality of its postgraduate education."},{"id":"02","title":"研究生規模與發展目標","titleEn":"Postgraduate population and targets","cn":"未來五年，澳大將對標國際化綜合性研究型大學，通過適度擴大辦學規模，實現從“精品特色”向“綜合卓越”的轉型。核心目標是總體學生人數於2035 年達到25,000 人，形成具備競爭力的中等辦學體量。預計2030/31 學年總學生規模達到22,211 人。主校區為18,244 人（其中有2,000 人同時在兩個校區上課及開展科研），合作區校區為3,967 人。大學的研究生佔比達到 55%左右，人文社科類與理工醫藥類的學生規模比例為1:1，實現綜合性研究型大學的人才結構特徵。","en":"In the next five years, benchmarking against international comprehensive research universities, UM will pursue moderate expansion and transition from ‘niche expertise’ to ‘a university of excellence with comprehensive strengths’ through measured enrolment growth. The core goal is to reach a total student population of 25,000 in 2035, thus becoming a competitive medium-scaled institution. In the academic year 2030/31, the total number of students is expected to reach 22,211, with 18,244 enrolled on the main campus (including 2,000 students attending classes and conducting research on both campuses simultaneously) and 3,967 enrolled on the Cooperation Zone campus. Postgraduate students will account for approximately 55% of the total student population. The ratio between humanities and social sciences students and science, engineering and medicine students will be 1:1, reflecting the student mix of a comprehensive research university."},{"id":"03","title":"碩士國際招生策略","titleEn":"International master’s recruitment","cn":"優化招生策略，拓展碩士課程的國際生源。以提升學術聲譽與優化招生流程為核心，突破生源瓶頸，應對激烈競爭，大學將實施以下相關招生策略 ——與內地一流高校建立優秀學生推薦機制，針對目標院校進行精準宣傳， 並為個別課程制定宣傳規劃；聚焦亞洲國家如馬來西亞、越南等進行宣傳， 並積極參與國際教育展；與國外院校開展雙學位課程或學生交流計劃，吸引國外院校的本科生報讀澳大；集中宣傳特色學科及熱門學科；招生宣傳會加入體驗元素，展現教學特色及研究水平；優化收生程序，建立新招生指標。","en":"Optimising recruitment strategies to expand international student sources for master’s programmes. To enhance academic reputation, optimise admission processes and address student source limitations amid intense competition, the University will implement the following admission strategies: establishing an outstanding student recommendation mechanism with leading institutions in the Chinese Mainland, developing customised publicity campaigns for targeted institutions and specific programmes; focusing promotional efforts on Asian countries such as Malaysia and Vietnam and actively participating in international education fairs; launching dual degree and student exchange programmes with overseas partners to attract international undergraduates; increasing publicity for signature and high-demand disciplines; adding experiential elements in recruitment events to showcase UM’s education strengths and research capacity; streamlining admission processes and establishing new recruitment indicators."},{"id":"04","title":"研究生住宿書院","titleEn":"Postgraduate residential colleges","cn":"建設研究生住宿書院。基於紹邦書院“研究生書院教育試點計劃”，澳大將建設“創新與跨領域交流”、“卓越研究”、“全球交流”等主題書院， 以協同創新研究院的學生、澳大人才計劃的博士生、國際生及交流生為主要入住群體。書院將深度融合澳大現有住宿書院系統的成功基因，並借鑒劍橋大學克萊爾學堂等世界一流研究生書院的先進理念，設計“核心課程模塊” 與“書院特色活動”，為研究生提供以學生為中心、立足社區，支持卓越研究、創新與國際化的教育平台。","en":"Developing postgraduate residential colleges. Building on Siu Pong College’s ‘Postgraduate Residential College Education Pilot Programme’, the University will develop new colleges centred on the themes ‘Innovation and Interdisciplinary Exchange’, ‘Research Excellence’, and ‘Global Engagement’. Their main residents will be students from the Institute of Collaborative Innovation, doctoral students under the UM Talent Scheme and international and exchange students. The colleges will combine the proven strengths of UM’s existing residential college system with best practices from world-class graduate colleges such as Clare College of the University of Cambridge, and will deliver ‘core curriculum modules’ and ‘college signature events’. They will provide postgraduate students with a student-centred, community-based educational platform for research of excellence, innovation, and internationalisation."},{"id":"05","title":"博士培養、數碼管理及交流","titleEn":"Doctoral training and digital administration","cn":"系統推進研究生教育管理體系的改革。面向社會需求，打破傳統博士生培養的單一學術導向，推動“轉化研究”單元納入博士課程。升級數字系統， 構建“數據驅動”治理，推出“線上論文典試委員會提交系統”，並在研究生管理系統中深度整合“畢業生職業發展追踪模塊”；持續收集學術單位及研究生的反饋，不斷優化研究生相關制度與流程。同時，建立大學層面的博士研究交流計劃，使博士生能參與國家級學術項目及世界級產業研究項目。","en":"Systematically reforming the postgraduate education management system. In response to societal needs, UM will move beyond the traditional single-focus on scholarly work in doctoral education by incorporating a ‘translational research’ module into doctoral curricula. It will upgrade its digital infrastructure to promote data-driven governance by launching an ‘online thesis submission system’ and embedding a ‘graduate career development tracking module’ into the graduate management platform. The University will continue to collect feedback from academic units and postgraduate students to refine postgraduate policies and processes. Concurrently, a university-level doctoral research exchange programme will be established to enable doctoral candidates to participate in national academic projects and world-class industry research initiatives."},{"id":"06","title":"課程審視與質量保障","titleEn":"Programme review and quality assurance","cn":"此外，大學將依據《高等教育制度》及《高等教育素質評鑑制度》，適時開展課程審視及院校素質核證工作，持續提升學術水平和教學質量。","en":"In addition, UM will conduct timely programme reviews and institutional quality assurance processes in accordance with the ‘Higher Education Regime’ and the ‘Higher Education Quality Evaluation System’ to steadily elevate academic standards and teaching quality."},{"id":"07","title":"國際碩士獎助學金","titleEn":"Scholarships for international master’s students","cn":"在激勵機制建設上，優化獎助學金體系，豐富獎助學金種類、提高資助額度，為國際碩士生設立A、B、C 類獎學金，覆蓋學費、生活費等核心支出， 同時為來校學期交流、暑期研習的國際學生提供多元化獎助支持，切實增強對全球優秀人才的吸引力，助力吸納更多來自合作院校的優質生源。","en":"Enhancing incentive mechanisms. The University will refine its scholarship and assistantship system by broadening the range of awards and increasing funding amounts. A categorised scholarship scheme (Categories A, B and C) will be established for international master’s students, covering key expenses such as tuition fees and living costs. In addition, diversified financial support will be provided for international students participating in semester exchanges and summer programmes at UM. These measures will effectively enhance the University’s attractiveness to outstanding global talent and facilitate the recruitment of high-quality students from partner institutions."},{"id":"08","title":"國際招生與審批流程","titleEn":"International admissions processes","cn":"在管理流程優化上，針對與國內外合作院校的交流項目、國際招生等工作簡化內部行政流程，改組大學層面的招生委員會，協同相關職能部門開展工作，提升決策效率與科學性。","en":"Optimising the management processes. The University will streamline internal administrative procedures for exchange programmes with domestic and international partner institutions, as well as for international student recruitment. The University will restructure the university-level admissions committee to coordinate relevant functional units, thereby enhancing the efficiency and scientific soundness of decision-making."},{"id":"09","title":"聯合培養學生全程支援","titleEn":"Support throughout joint programmes","cn":"在服務保障升級上，強化與內地高校、葡（西）語系及英語系國家合作院校聯合培養學生的全過程管理與精細化服務，完善跨校學分互認、學籍管理、住宿安排、文化適應指導等配套服務；建立合作成效評估反饋體系，定期梳理與各夥伴院校在雙學位、科研項目、學術交流等項目上的合作成果， 跟蹤項目實施進度，不斷優化合作策略與服務舉措。","en":"Upgrading support. The University will strengthen whole-process management and provide more refined services for students participating in joint training programmes with partner institutions in the Chinese Mainland, as well as in Portuguese-, Spanish- and English-speaking countries. It will enhance supporting arrangements such as cross-university credit transfer, student records management, accommodation and cultural orientation. In parallel, a feedback and evaluation mechanism will be established to assess the effectiveness of partnerships, to regularly review collaborative outcomes of dual degree programmes, research projects and academic exchanges with partner institutions, and to monitor implementation progress, thereby continuing to refine the partnership strategies and support measures."},{"id":"10","title":"國際化戰略4S、4地區、4目標","titleEn":"Internationalisation: 4S, 4 Zones, 4 Aims","cn":"澳門大學將明確國際化戰略、重心與目標，透過“4S  4Zones  4Aims ”， 充分發揮澳大國際化優勢與特色，全面提升大學課程、生源、師資與合作項目的質量，打造國際化、協作化、動態活力的教研樞紐。  4S（4S 戰略）：澳大繼續推行“4S”國際化戰略——“Strategic（戰略性）”、“Substantial（實質性）”、“Specific（具體性）”、 “Sustainable（可持續性）”  4Zones（4 地區）：面向“4 個重點地區”——葡（西）語系國家、 英語系國家、“一帶一路”沿線國家與亞太鄰近國家、中國內地及香港地區（C9+及一流大學）  4Aims（4目標）：緊扣“4個國際目標”——國際師資、國際課程、 國際學生與國際交流","en":"The University of Macau will specify its internationalisation strategy, priorities and objectives. Through the ‘4S • 4 Zones • 4 Aims’ framework, the University will fully capitalise on its strengths and distinctive features in internationalisation to comprehensively enhance the quality of its programmes, student intake, faculty and collaborative initiatives. In doing so, it aims to establish itself as an internationally oriented, collaborative and dynamic hub for teaching and research.  4S Strategy: UM will continue to implement the ‘4S’ internationalisation strategy — ‘Strategic’, ‘Substantial’, ‘Specific’ and ‘Sustainable’.  4 Zones: Targeting four key regions — Portuguese- and Spanish-speaking countries, English-speaking countries, countries along the ‘Belt and Road’, neighbouring countries in the Asia-Pacific region, and the Chinese Mainland and the Hong Kong SAR (C9+ and top universities).  4 Aims: Focusing on four internationalisation objectives — international faculty members, internationalised programmes, international students and international exchange."},{"id":"11","title":"全球合作夥伴網絡","titleEn":"Global partnership network","cn":"大學將全方位推進合作網絡建設，目標是構建覆蓋全球超過40 個國家和地區、合作院校超過400 所的高質量國際合作網絡，全面提升國際合作範圍與深度，穩步增強國際招生與品牌影響力。","en":"UM will adopt a comprehensive approach to advancing its partnership network, with the aim of establishing a high-quality global network spanning over 40 countries and regions and more than 400 partner institutions. It will broaden and deepen international collaboration, while steadily increasing international student recruitment and elevating its global profile and influence."},{"id":"12","title":"國際雙學位及聯合培養","titleEn":"International dual degrees and joint training","cn":"大學未來五年致力推動實現“每個學院/研究院/書院均設有國際項目”。 其中，重點推動合作區校區的醫學院、信息學院、工學院、設計學院開展國際雙學位項目。","en":"Over the next five years, UM will work towards ensuring that each faculty, institute and residential college offers international programmes. In particular, priority will be given to developing international dual degree programmes in the Faculty of Medicine, the Faculty of Information Science and Computing, the Faculty of Engineering, and the Faculty of Design on the Cooperation Zone campus."},{"id":"13","title":"國際學生及師生交流","titleEn":"International student and academic exchanges","cn":"推動師生流動常態化。一方面鼓勵本校優秀學生赴內地一流高校及國際夥伴院校，開展短期訪學、交換學習，參與對方的科研項目與學術活動，拓寬本土學生的視野與格局；另一方面擴大暑期研習營、短期學術訓練營等活動規模，優化活動內容設計，吸引全球合作院校學生來校交流，增進國際學生對澳大及澳門的認識，構建長期、可持續的學術協作與人文紐帶。","en":"Promoting staff and student mobility as a regular practice. On the one hand, UM will encourage outstanding students to undertake short-term study visits and exchange programmes at leading universities in the Chinese Mainland and partner institutions overseas, and to participate in their research projects and academic activities, thereby broadening their perspectives and visions. On the other hand, it will expand the scale of summer camps, short-term academic training programmes and similar activities, refine programme design, and attract students from partner institutions worldwide to exchange at UM. These efforts will enhance international students’ understanding of UM and Macao, so as to foster long-term, sustainable academic collaboration and people-to-people ties."},{"id":"14","title":"一校兩區統一管理","titleEn":"Unified management across two campuses","cn":"大學主校區與合作區校區採取一體化統一管理，管理體制、運作經營、 學生培養及取得學歷均一致。澳大將積極探索實踐一套符合兩地法律要求的一體化管理及營運模式。","en":"The University will implement integrated and unified management across its main campus and the Cooperation Zone campus, ensuring consistency across governance systems, operational models, student education and the awarding of academic qualifications. UM will actively explore and implement an integrated management and operational model that complies with the legal requirements of both jurisdictions."},{"id":"15","title":"研究生宿舍S5及S6","titleEn":"Postgraduate Houses S5 and S6","cn":"主校區將持續按計劃有序開展宿舍建造工程，重點是S5 及S6 的研究生宿舍建設，預計2027 年第二季完工，屆時將新增1,007 間學生房間。","en":"On the main campus, accommodation projects will continue to be advanced in line with the established plan, with priority given to the construction of Postgraduate Houses S5 and S6. These are scheduled for completion in the second quarter of 2027, delivering an additional 1,007 student rooms."},{"id":"16","title":"研究生入學成績單驗真","titleEn":"Postgraduate admission transcript verification","cn":"依托“國際跨境可信數據空間—澳琴站”技術支撐， 搭建大學與合作區數據跨境安全監管平台，優先推進研究生入學申請成績單驗真服務，實現學信網驗證及大灣區院校互認。","en":"Leveraging the technical underpinning of the ‘International Cross-Border Trusted Data Space – Macao-Hengqin Node’, the University will establish a cross‑border data security and regulatory oversight platform between the University and the Cooperation Zone. Priority will be given to implementing a transcript verification service for postgraduate admissions, enabling authentication through the China Higher Education Student Information website and mutual recognition among institutions within the GBA."}];
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const blockText = value => escapeHTML(value).replace(/\n/g,'<br>');
const table = rows => rows ? '<table class="data">'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+escapeHTML(v)+'</td>').join('')+'</tr>').join('')+'</table>' : '';
let current = location.hash.toLowerCase()==='#plan'?'P':(/^#[a-d]$/i.test(location.hash)?location.hash.slice(1).toUpperCase():'A');
function renderPaper() {
 const paper=PAPERS.find(p=>p.id===current);
 $('heading').textContent=paper.id+'卷';
 $('content').innerHTML=paper.items.map((q,i)=>{
   const zh=q.lang==='中文';
   const lang=zh?'zh-Hant':'en';
   return `<details ${i===0?'open':''}><summary><span class="index">${escapeHTML(q.id)}</span><span class="name" lang="${lang}">${escapeHTML(q.title)}</span><span class="arrow" aria-hidden="true">⌄</span></summary><div class="answer-area"><section class="block"><div class="label">${zh?'題目':'Question'}</div>${q.context?`<p class="context" lang="en">${blockText(q.context)}</p>`:''}<div class="question" lang="${lang}">${blockText(q.question)}</div>${table(q.extra)}</section><section class="block"><div class="label">${zh?'參考答案':'Model answer'}</div><div class="model" lang="${lang}">${blockText(q.model)}</div></section></div></details>`;
 }).join('');
}
function renderPlan() {
 $('heading').textContent='五年規劃';
 $('content').innerHTML=PLAN.map((x,i)=>`<details class="plan-card" ${i===0?'open':''}><summary><span class="name">${escapeHTML(x.title)}<span class="name-en" lang="en">${escapeHTML(x.titleEn)}</span></span><span class="arrow" aria-hidden="true">⌄</span></summary><div class="answer-area"><div class="plan-cols"><div class="plan-copy" lang="zh-Hant">${blockText(x.cn)}</div><div class="plan-copy" lang="en">${blockText(x.en)}</div></div></div></details>`).join('');
}
function render() {
 const tabs=[...PAPERS.map(p=>({id:p.id,label:p.id+'卷'})),{id:'P',label:'五年規劃'}];
 $('nav').innerHTML=tabs.map(t=>`<button class="tab" type="button" data-tab="${t.id}" aria-selected="${t.id===current}">${t.label}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
   current=b.dataset.tab;
   history.replaceState(null,'',current==='P'?'#plan':'#'+current);
   render();window.scrollTo({top:0,behavior:'instant'});
 }));
 if(current==='P') renderPlan(); else renderPaper();
 $('expand').textContent='全部展開';
}
$('expand').addEventListener('click',()=>{
 const cards=[...document.querySelectorAll('#content details')];
 const open=!cards.every(el=>el.open);
 cards.forEach(el=>el.open=open);
 $('expand').textContent=open?'全部收起':'全部展開';
});
window.addEventListener('hashchange',()=>{
 current=location.hash.toLowerCase()==='#plan'?'P':(/^#[a-d]$/i.test(location.hash)?location.hash.slice(1).toUpperCase():'A');render();
});
render();
</script></body></html>
