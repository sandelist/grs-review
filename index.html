<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002C55">
<title>GRS 四卷複習</title>
<style>
:root{
  --um-navy:#002C55;
  --um-yellow:#FFD446;
  --white:#FFFFFF;
  --navy-muted:rgba(0,44,85,.70);
  --navy-line:rgba(0,44,85,.20);
  --navy-faint:rgba(0,44,85,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:94px}
body{margin:0;background:var(--white);color:var(--um-navy);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.shell{width:min(1100px,100%);margin:0 auto;padding-left:28px;padding-right:28px}
.top-gold{height:5px;background:var(--um-yellow)}
.utilitybar{background:var(--um-navy);color:var(--white);font-size:11px;letter-spacing:.09em}
.utility-inner{display:flex;gap:16px;align-items:center;justify-content:space-between;min-height:35px}
.utility-inner span:last-child{color:var(--um-yellow)}
.site-header{background:var(--white)}
.masthead{display:flex;align-items:center;gap:21px;min-height:104px}
.wordmark{color:var(--um-navy);font-family:Arial,sans-serif;letter-spacing:-.075em;font-weight:900;font-size:44px;line-height:1;white-space:nowrap}
.mark-separator{height:48px;width:3px;background:var(--um-yellow)}
.institution{display:flex;flex-direction:column;line-height:1.25;gap:7px}
.institution-cn{font-weight:750;letter-spacing:.055em;font-size:18px}
.institution-en{font-size:10px;letter-spacing:.16em;font-weight:700}
.masthead-tag{margin-left:auto;border-left:1px solid var(--navy-line);padding-left:18px;font-size:12px;font-weight:700;letter-spacing:.11em;text-align:right}
.navbar{background:var(--white);border-top:1px solid var(--navy-line);border-bottom:1px solid var(--navy-line);position:sticky;top:0;z-index:15;box-shadow:0 2px 7px rgba(0,44,85,.05)}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.tab{display:flex;align-items:center;justify-content:center;gap:17px;min-height:64px;padding:12px 8px;background:var(--white);border:0;border-bottom:5px solid transparent;color:var(--um-navy);text-align:center;transition:background .15s,border-color .15s}
.tab span{font-size:17px;font-weight:750;letter-spacing:.09em}
.tab b{font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;background:var(--um-navy);color:var(--white);padding:1px 8px;border-radius:2px;min-width:37px}
.tab[aria-selected=true]{border-bottom-color:var(--um-yellow);background:var(--um-navy);color:var(--white)}
.tab[aria-selected=true] b{background:var(--um-yellow);color:var(--um-navy)}
.tab:hover:not([aria-selected=true]){background:rgba(0,44,85,.06)}
.hero{background:var(--um-navy);color:var(--white);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:max(0px,calc((100vw - 1100px)/2));top:0;width:10px;height:100%;background:var(--um-yellow)}
.hero-in{padding-top:34px;padding-bottom:38px}
.hero-eyebrow{color:var(--um-yellow);font-size:11px;letter-spacing:.21em;font-weight:800;margin-bottom:7px}
h1{font-weight:750;font-size:38px;line-height:1.2;letter-spacing:.08em;margin:0 0 10px}
.hero-desc{font-size:14px;letter-spacing:.09em}
.hero-desc i{display:inline-block;height:9px;width:9px;background:var(--um-yellow);margin-right:9px;transform:rotate(45deg);vertical-align:1px}
.site-main{padding-top:36px;padding-bottom:65px;min-height:400px}
.controls{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:19px;padding-bottom:17px;border-bottom:2px solid var(--um-navy)}
.paper-intro{min-width:190px}
.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:850;color:var(--navy-muted);text-transform:uppercase;margin-bottom:7px}
h2{font-size:24px;line-height:1.32;margin:0;font-weight:760;letter-spacing:.02em}
.count{font-size:12px;color:var(--navy-muted);margin-top:7px;display:block}
.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:9px;padding-bottom:2px}
input{width:min(230px,45vw);min-width:0;background:var(--white);color:var(--um-navy);border:1px solid var(--um-navy);border-radius:0;padding:9px 12px;font-size:13px;outline:none}
input::placeholder{color:var(--navy-muted)}
input:focus{outline:3px solid var(--um-yellow);outline-offset:1px}
.action{background:var(--um-navy);color:var(--white);border:1px solid var(--um-navy);border-radius:0;padding:9px 13px;font-size:13px;font-weight:700}
.action:hover{background:var(--white);color:var(--um-navy)}
#content{display:grid;gap:13px}
details.card{background:var(--white);border:1px solid var(--navy-line);border-left:5px solid var(--um-navy);overflow:hidden}
details.card[open]{border-left-color:var(--um-yellow);border-top-color:var(--um-navy);border-right-color:var(--um-navy);border-bottom-color:var(--um-navy)}
summary{display:flex;align-items:center;gap:17px;list-style:none;padding:18px 18px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:hover{background:rgba(0,44,85,.035)}
.code{min-width:66px;color:var(--um-navy);font-size:20px;font-family:Arial,sans-serif;font-weight:850;letter-spacing:-.02em}
.heading{flex:1;font-size:17px;line-height:1.45;font-weight:750;min-width:0}
.marks{font-size:12px;font-weight:650;color:var(--navy-muted);white-space:nowrap}
.arrow{font-size:19px;font-weight:bold;color:var(--um-navy);transform:rotate(0);transition:transform .15s}
details[open] .arrow{transform:rotate(180deg)}
.body{padding:22px 25px 26px;background:var(--white);border-top:1px solid var(--navy-line)}
.block{margin:0 0 23px}
.block:last-child{margin-bottom:0}
.label{border-left:5px solid var(--um-yellow);padding-left:11px;font-size:14px;font-weight:800;letter-spacing:.045em;margin:0 0 12px;color:var(--um-navy)}
.question{white-space:pre-line;overflow-wrap:anywhere;line-height:1.9}
.context{white-space:pre-line;border-left:2px solid var(--navy-line);padding:0 0 0 14px;margin:0 0 15px;color:var(--navy-muted);font-size:14px;line-height:1.8}
.bullets{list-style:none;padding:0;margin:0}
.bullets li{position:relative;padding:4px 0 4px 18px;line-height:1.85}
.bullets li:before{content:"";position:absolute;left:1px;top:16px;width:8px;height:8px;background:var(--um-yellow);border:1px solid var(--um-navy)}
.answer{padding:7px 15px;border-left:2px solid var(--um-navy);border-bottom:1px solid var(--navy-faint)}
.data{border-collapse:collapse;width:100%;margin:18px 0;font-size:13px;line-height:1.6}
.data td{border:1px solid var(--navy-line);padding:9px 11px}
.data tr:first-child td{font-weight:750;background:var(--um-navy);color:var(--white)}
.empty{padding:50px 12px;text-align:center;color:var(--navy-muted)}
.footer{border-top:5px solid var(--um-yellow);background:var(--um-navy);color:var(--white)}
.footer-in{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px;padding-bottom:20px;font-size:12px;letter-spacing:.06em}
.footer-in span:last-child{color:var(--um-yellow)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--um-yellow);outline-offset:-3px}
@media(max-width:720px){
  .shell{padding-left:17px;padding-right:17px}
  .utility-inner{min-height:31px}.utility-inner span:last-child{display:none}
  .masthead{min-height:85px;gap:13px}.wordmark{font-size:35px}.mark-separator{height:39px}
  .institution-cn{font-size:15px}.institution-en{font-size:9px;letter-spacing:.07em}
  .masthead-tag{display:none}
  .tab{min-height:54px;gap:8px}.tab span{font-size:15px}.tab b{font-size:11px;min-width:29px;padding:1px 5px}
  .hero-in{padding-top:24px;padding-bottom:29px}.hero:after{width:5px}h1{font-size:30px}
  .site-main{padding-top:27px}.controls{align-items:stretch;flex-direction:column;gap:15px}
  .paper-intro{min-width:0}h2{font-size:21px}.tools{justify-content:stretch}
  .tools input{flex:1;width:auto}.tools .action{white-space:nowrap}
  summary{padding:16px 12px;gap:8px}.code{font-size:17px;min-width:55px}.heading{font-size:15px}.marks{font-size:11px}.arrow{font-size:16px}
  .body{padding:19px 13px 22px}.question,.bullets li{font-size:14px}.context{font-size:13px}
  .footer-in{font-size:11px}
}
@media(max-width:400px){.tab{gap:4px}.tab span{font-size:14px}.tab b{font-size:10px}.masthead{gap:10px}.institution-cn{font-size:14px}.institution-en{font-size:8px}.code{min-width:47px}.marks{font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
@media print{.utilitybar,.navframe,.hero,.tools,.footer{display:none}details.card{break-inside:avoid}details.card>.body{display:block!important}.site-main{padding-top:0}summary{padding:12px}#content{gap:5px}}
</style></head>
<body>
<div class="top-gold" aria-hidden="true"></div>
<div class="utilitybar"><div class="shell utility-inner"><span>GRS / PRACTICE REVIEW</span><span>獨立模擬筆試複習</span></div></div>
<header class="site-header"><div class="shell masthead"><div class="wordmark" aria-hidden="true">GRS</div><div class="mark-separator" aria-hidden="true"></div><div class="institution"><div class="institution-cn">澳門大學研究生院 · 模擬筆試</div><div class="institution-en">GRADUATE SCHOOL · PRACTICE PAPERS</div></div><div class="masthead-tag">A — D<br>2026</div></div></header>
<div class="navbar"><nav class="shell" id="nav" aria-label="選擇試卷"></nav></div>
<section class="hero"><div class="shell hero-in"><div class="hero-eyebrow">POSTGRADUATE PRACTICE</div><h1>四卷複習</h1><div class="hero-desc"><i aria-hidden="true"></i>題目　/　答案　/　分析</div></div></section>
<main class="shell site-main"><div class="controls"><div class="paper-intro"><div class="eyebrow">PAPER REVIEW</div><h2 id="title"></h2><span class="count" id="count"></span></div><div class="tools"><input id="search" type="search" placeholder="搜尋題目" aria-label="搜尋題目"><button class="action" id="expand" type="button">全部展開</button></div></div><section id="content"></section></main>
<footer class="footer"><div class="shell footer-in"><span>GRS · 四卷複習</span><span>非官方模擬練習</span></div></footer>
<script>
const PAPERS=[{"id":"A","score":55,"name":"招生與現場應變","items":[{"id":"A1","title":"跨校區招生與服務","marks":40,"lang":"中文","question":"澳大正推進五年發展規劃及研究生教育。部分研究生已在橫琴過渡期辦學點上課或研究，亦已有學生在當地住宿；這不等於新合作區校區已全面建成。\n\n假設研究生院須在現有人手及預算下，協助增加合資格研究生申請及最終入學人數，同時維持主校區和橫琴辦學點的服務質素。作為行政人員，你認為最需要處理哪三項行政挑戰？請逐項說明其影響及可行措施，列明主要協作單位，並解釋你會優先處理哪一項。最後提出兩項可量度指標：一項反映招生或入學成效，另一項反映服務或資訊質素。\n\n毋須假設兩地所有程序都不同，也毋須背誦具體出入境法規或內部KPI；重點是說明哪些事項需要核實、如何協調及跟進。","answer":["提出兩地規則與私隱、橫琴學生求助、查詢量與人手三項挑戰。","建議跨校區調配人手、加強溝通，以及以AI chatbot協助回覆查詢。","以每年入學人數和新生服務滿意度作指標。"],"analysis":["能辨識合規與服務需要，兩項指標合理。","部分挑戰重疊；協作方法仍可具體化。","原稿未明確寫出最優先處理哪項挑戰及理由。"]},{"id":"A2(a)","title":"直播前準備","marks":10,"lang":"English","question":"Identify five essential pre-event checks. For each, name the person or team you would involve. Cover programme information and materials, speakers and duties, and the practical arrangements for running the sessions.","answer":["檢查網絡及電腦連線，與ICTO協作。","與學院代表確認講題，安排聯合測試。","確認最新版PPT，並與傳訊部核對宣傳安排。"],"analysis":["技術、講者及材料方面的準備具體。","可加上文字答疑的分工、交接及疑難升級安排。"],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A2(b)","title":"直播講者斷線","marks":10,"lang":"English","question":"Five minutes into the second session, the speaker loses the connection. A backup slide deck is available, but the reconnection time is unknown. Explain your immediate response and how you would protect the remaining programme and inform participants.","answer":["在聊天室通知參與者。","利用後備投影片保持直播，協調另一名已準備好的講者先發言。","讓暫時失去網絡連線的講者在恢復後繼續。"],"analysis":["調整講者次序是合理的替代應變方案。","可補上技術重連、時間界線及未完成問題的跟進。"],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A2(c)","title":"過時投影片","marks":10,"lang":"English","question":"A reused slide states that all teaching is on the main campus and that every successful applicant receives a full scholarship. The current approved programme information does not support either statement. Viewers have already seen the slide. What would you do during the session and afterwards?","answer":["未作答。"],"analysis":["應即時停止使用錯誤投影片，澄清教學地點和獎學金資訊。","核實後修正PPT、錄影及相關FAQ，跟進已接觸錯誤資訊的人。"],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A2(d)","title":"公開聊天室的私隱","marks":10,"lang":"English","question":"An applicant posts a passport image and examination results in the public chat and asks staff to guarantee admission and a Hengqin room immediately. Explain how you would protect the applicant while providing a useful response and arranging follow-up.","answer":["要求申請人停止在公開聊天室分享個人資料。","提醒其他參與者不要截圖。","指出申請資料會按程序審核。"],"analysis":["有私隱保護意識。","應安排移除已公開的資料及轉到安全的私人渠道。","不可保證取錄或宿位；應提供可行下一步。"],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A3","title":"AI輔助招生行政","marks":20,"lang":"English","question":"Following the livestreams, GRS has approved programme information, chat records containing personal details, unanswered enquiries and participation figures. A colleague proposes uploading all records to a free public AI tool to generate replies automatically.\n\nDesign a safer workflow. State three useful AI applications and three specific safeguards, and identify who should check and authorise applicant-facing outputs. Explain how unresolved academic or admissions questions would be handled rather than automatically answered.\n\nNo product names or programming knowledge are required. Your response should explain a workable division between AI assistance and human responsibility.","answer":["在上載前移除個人資料。","只使用獲批准的AI工具。","由研究生院及主管人工核對對外內容。"],"analysis":["把工作流程理解為處理學生查詢，是合理的題意理解。","但題目仍明確要求三項AI用途及未解問題的轉介；原稿沒有充分展開。","AI分類問題、找出重複查詢、草擬已核准資訊的回覆，都是可接受的用途。"]}]},{"id":"B","score":63,"name":"個人經驗與發展","items":[{"id":"B1","title":"經驗如何支持研究生院","marks":40,"lang":"中文","question":"在你過去的學習及工作經歷中，哪一段經歷最有助你勝任澳門大學研究生院的行政工作？\n\n請以兩個真實工作或學習例子，說明你採取的行動、取得的結果或所得的經驗，再歸納三項可轉用於研究生院的能力。其應用須同時涉及招生推廣及至少一項非宣傳的研究生院工作，並考慮主校區與橫琴辦學點的需要。\n\n最後指出一項你仍需補足的研究生行政知識，以及入職後如何有系統地學習。\n\n不要求曾經做過研究生招生或學籍工作。只採用自己的真實經驗；不能量化的成果，可用已完成的工作、問題改善或回饋說明，不必虛構數字。","answer":["以大學傳訊部的校園記者計劃為例，介紹工作坊、典禮、學生文案指導及歸屬感。","分享每年處理約200至300份校園記者申請、分類及data cleansing的經驗。","歸納溝通、數據整合、文字撰寫能力；建議親自模擬一次研究生申請流程。"],"analysis":["工作例子具體，既有傳訊也有申請資料管理。","已充分考過個人工作能力，不宜在D卷原樣重考。","若直接應用到研究生院，應更清楚交代所屬工作流程及服務對象。"]},{"id":"B2","title":"未來一年的三項工作","marks":60,"lang":"English","question":"UM’s Five-Year Development Plan places postgraduate education within the development of an international comprehensive research university. It combines growth and international cooperation with stronger education and quality assurance. Postgraduate teaching, research and residential life are already taking place at transitional sites in Hengqin.\n\nWith limited staff and resources, what three priorities would you recommend for the Graduate School over the next twelve months? At least one should address recruitment and at least one should address the experience, academic progress or development of enrolled postgraduate students. The third is your choice.\n\nFor each priority, explain why it matters, propose practical actions, identify the main partners and give one measurable outcome. Relate your recommendations to UM’s five-year direction and the needs of students across Macao and Hengqin. Conclude by explaining how you would prioritise resources without sacrificing fairness or educational quality.\n\nYou may build on existing activities, including mainland recruitment, online briefings, international outreach and academic support. Do not assume these activities are absent. No particular combination of initiatives is the only correct answer; marks reward justified choices and workable execution. You are not required to invent institutional targets.","answer":["介紹住宿式書院生活，邀請書院代表與研究生分享，透過問卷了解吸引力。","宣傳國際交換機會，與全球事務部及學院合作。","尋求與海外大學的聯合研究生課程；以申請人數等觀察成效。","優先推行書院網上簡介，理由是成本較低、容易執行。"],"analysis":["已具備國際交換及海外合作思路，並非缺乏國際視野。","思路較多停留在宣傳、吸引申請及合作項目，少談研究生教育成果與證據。","後續練習應轉向國際制度比較，而不是重寫三項國際化建議。"]}]},{"id":"C","score":67,"name":"學生服務與數據","items":[{"id":"C1","title":"橫琴博士生複合查詢","marks":30,"lang":"中文","question":"模擬情境：一名博士生部分教研活動在橫琴辦學點進行，並已入住當地學生公寓。他向研究生院反映，兩份通知列出的進度報告期限不同，導師尚未回覆其查詢，他擔心影響資助；另外，他對下週主校區活動的交通安排及可使用的支援服務感到不清楚。\n\n你是首先收到查詢的研究生院行政人員。請提出有先後次序的處理方案，涵蓋即時回應、期限及進度程序核實、與導師／學院及相關行政單位的協調、生活與跨校區資訊，以及後續跟進。\n\n說明哪些事項可由你直接協助，哪些須經相關單位確認或批准。不得僅把學生轉介後便結束，也不得自行延長期限或裁定其資助結果。\n\n題目未提供學生所屬資助計劃或最終適用期限；不要求猜測。毋須引用條文編號，也不應把另一校區當作另一所大學。","answer":["向學術單位核實進度期限，並請相關人員聯絡導師。","向交通／活動單位了解安排，再以電郵回覆學生。","不自行裁定資助，維持聯絡並待進一步核實。"],"analysis":["有核實權限、聯絡對口及跟進的基本思路。","可更明確把報告期限及資助風險列為優先處理事項。","轉介後仍要由接案人追蹤回覆，不宜只等待其他單位。"]},{"id":"C2(a)","title":"兩所大學的宣講行程","marks":15,"lang":"English","question":"Propose a realistic programme from 09:30 to 16:30, preserving both briefings and allowing preparation, lunch, transfers and a reasonable buffer. State the main recruitment purpose in one sentence. Do not add unrelated visits.","answer":["編排09:30前期準備、10:00–11:00 A大學宣講、前往B大學和午餐、14:00–15:00 B大學宣講、前往口岸。","宣講目的為推廣澳大研究生課程。"],"analysis":["能把固定活動和交通整合成一日行程。","行程題應特別檢查轉場、用餐與最後到達口岸的緩衝是否足夠。"],"context":"Hypothetical scenario: a GRS team and academic representatives are already in Zhuhai for two university recruitment briefings. University A’s session is fixed at 10:00–11:00 and University B’s at 14:00–15:00. Transfer from A to B takes 45 minutes; travel from B to the departure border checkpoint takes 60 minutes. The team must reach that checkpoint by 16:30. A working lunch and preparation time are needed."},{"id":"C2(b)","title":"外訪前準備","marks":10,"lang":"English","question":"State three grouped preparation checks. Cover (i) the agreed agenda, speakers and approved materials; (ii) transport and travel-document arrangements; and (iii) meal timing, numbers and dietary requirements. Name the relevant contacts or responsible parties, and include a backup for one critical arrangement.","answer":["確認所有工作人員的講題、FAQ及核准簡報。","提醒攜帶證件，與司機預先核實行程。","確認用餐人數、飲食要求，並提出備用司機安排。"],"analysis":["準備涵蓋材料、交通和餐飲。","更精簡的版本可先指明每項負責人及關鍵備援。"],"context":"Hypothetical scenario: a GRS team and academic representatives are already in Zhuhai for two university recruitment briefings. University A’s session is fixed at 10:00–11:00 and University B’s at 14:00–15:00. Transfer from A to B takes 45 minutes; travel from B to the departure border checkpoint takes 60 minutes. The team must reach that checkpoint by 16:30. A working lunch and preparation time are needed."},{"id":"C3(a)","title":"研究生招生公告","marks":20,"lang":"English","question":"Use only this hypothetical fact sheet to write a short recruitment announcement for UM’s website (100–120 words including the headline). Do not add a URL or hashtags. Include a clear headline, relevant benefits for prospective postgraduate students and a specific next step. Do not invent course titles, rankings, speakers, quotations or confirmed benefits.","answer":["撰寫網上普通話研究生資訊講座公告，列出11月5日19:00–20:00、AI／工程／設計、報名方法及截止時間。","提及研究機會及澳門／橫琴的安排。"],"analysis":["有寫出大部分核心活動資訊。","原題要求不加網址；原稿出現了「http:xxxx」佔位字樣。","須區分活動免費與招生或錄取免費，也不可增加未確認的福利。"],"extra":[["Event","Postgraduate Study at UM: Information Session"],["When / format","5 November 2026, 19:00–20:00, Beijing/Macao time; online, in Mandarin"],["Speakers / topics","GRS and academic representatives; artificial intelligence, engineering and design; applications, research opportunities and study arrangements across Macao and Hengqin"],["Attendance","Free; register through UM’s official event registration page by 17:00 on 3 November"],["Limits","Teaching location depends on the programme and confirmed arrangements. No guaranteed admission, scholarship or accommodation is announced."]]},{"id":"C3(b)","title":"有條件錄取申請人電郵","marks":15,"lang":"English","question":"Today is 6 November in this hypothetical case. An applicant’s conditional offer requires a final transcript by 10 November through the official system, but their current university says it can issue it only on 18 November. The applicant asks you to approve an extension and confirm funding and accommodation, neither of which has been individually confirmed. Draft a helpful email reply explaining the next steps and what remains subject to confirmation. You may not approve exceptions yourself.","answer":["回覆資助及住宿目前不能保證。","要求申請人提供成績單延遲發出的證明，表示會評估個案再回覆。"],"analysis":["不作未獲批准的承諾，方向正確。","應交代10日截止與18日可取得文件的衝突，並說明正式延期須獲授權單位核准。","可指出安全的提交渠道與跟進時間。"]},{"id":"C4","title":"招生推廣數據","marks":10,"lang":"中文","question":"以下均為模擬數據：兩個已完成的招生推廣組別採用相同統計定義及同樣的觀察期。各組內已去除重複人士，已完成申請及符合基本資格的申請均可追溯至該組參與者。組別並非隨機分配，尚無錄取或註冊結果。\n\n(a) 分別計算甲、乙兩組的「完成申請／參與者」比例，以及「符合基本資格／完成申請」比例。\n(b) 有人說：「乙組參與者較多，所以招生一定更成功。」你是否同意？用數據說明，並指出一項比較限制。\n(c) 提出一項可跟進的改善措施及一項後續成效指標。不要把符合基本資格等同獲錄取。","answer":["計算甲、乙兩組申請轉換率及合資格比例。","認為不能單憑觀看／參與人數判斷成效，應觀察申請及資格結果。","建議改善網上申請流程與文件提交。"],"analysis":["完成申請率正確應為甲40÷400＝10%、乙48÷800＝6%；原稿寫成1%和0.6%。","合資格／完成申請比例為甲30÷40＝75%、乙24÷48＝50%，原稿這兩項正確。","參與者較多不等於招生更成功；最終錄取和註冊結果尚未提供。"],"extra":[["組別","獨立參與者","完成申請","符合基本資格的申請"],["甲","400","40","30"],["乙","800","48","24"]]}]},{"id":"D","score":69,"name":"國際研究與資料核實","items":[{"id":"D1","title":"個人經驗與研究生支援","marks":40,"lang":"中文","question":"請從你親身的研究生學習或專業服務經驗中，選擇一項值得借鑑的做法，說明如何把它適當地應用於澳門大學的研究生支援。","answer":["分享在利物浦大學網上修讀研究生課程時，使用Libby服務遇到問題而向支援團隊查詢。","大約一個工作天獲得有禮回覆，對方解釋權益並轉介資訊科技部門，問題很快解決。","由此歸納同理心、及時回覆、不越權及跨部門協助。"],"analysis":["成功運用真實海外研究生經驗，而非重用B1工作履歷。","可進一步把服務原則落到研究生院的明確查詢渠道、回覆時限與轉介跟進。"]},{"id":"D2","title":"海外大學第一學期支援研究","marks":35,"lang":"English","question":"The Dean asks you to investigate how overseas universities support international postgraduate students during their first semester. Explain how you would conduct this study and use its findings to advise UM.","answer":["建議查看QS、THE前50院校的資料。","蒐集住宿、資助、心理健康、課程選擇及交流等服務資訊。","使用AI搜尋，並以Excel、Power BI或簡報整理，與主管及學院討論適用做法。"],"analysis":["有蒐集、整理及交付研究結果的基本流程。","排名靠前不等於新生支援最好，院校選取應看可比性。","官方宣傳只能證明服務存在，未必證明有效；應核對學生回饋或評估證據。"]},{"id":"D3","title":"博士學位數據核實","marks":25,"lang":"English","question":"UM's Rector's Office is preparing postgraduate data for a university-level ranking submission and asks GRS to confirm the number of doctoral degrees formally awarded in calendar year 2025. GRS's approved degree-award register records 186 such awards, while a spreadsheet from academic units lists 211 students who completed doctoral requirements during academic year 2024/25. Your GRS supervisor asks you to examine the two records before any official response is sent to the Rector's Office. How would you establish and document the appropriate figure for your supervisor?","answer":["提出檢查研究生院試算表的計算。","聯絡學術單位索取學生紀錄，逐項比較、核實並記錄處理過程。","將結果交主管確認，再向校長辦公室提供資料。"],"analysis":["最關鍵：186是2025「曆年正式授予」；211是2024/25「學年完成課程要求」。期間與計量對象均不同。","兩組數字不同不代表有學生遺漏，不能先假設需要湊至一致。","核對186的來源、授予日期及更正紀錄，再交主管確認。原GPT給全卷69分，但亦承認未察覺曆年／學年的差異。"]}]}];
let current='A';
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>e(s).replace(/\n/g,'<br>');
const list=a=>'<ul class="bullets">'+a.map(s=>'<li>'+e(s)+'</li>').join('')+'</ul>';
const table=a=>a?'<table class="data">'+a.map(row=>'<tr>'+row.map(s=>'<td>'+e(s)+'</td>').join('')+'</tr>').join('')+'</table>':'';
function render(){
  $('nav').innerHTML=PAPERS.map(p=>`<button class="tab" data-tab="${p.id}" aria-selected="${p.id===current}"><span>${p.id}卷</span><b>${p.score}</b></button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.tab;$('search').value='';render();window.scrollTo(0,0)}));
  const p=PAPERS.find(x=>x.id===current);$('title').textContent=p.id+'卷 · '+p.name;
  const term=$('search').value.trim().toLowerCase();
  const items=p.items.filter(x=>!term||[x.id,x.title,x.question,x.context||'',...x.answer,...x.analysis].join(' ').toLowerCase().includes(term));
  $('count').textContent=items.length+'題';
  $('content').innerHTML=items.length?items.map((q,i)=>`<details class="card" ${i===0?'open':''}>
    <summary><span class="code">${e(q.id)}</span><span class="heading">${e(q.title)}</span><span class="marks">${q.marks}分 · ${q.lang==='中文'?'中文':'English'}</span><span class="arrow">⌄</span></summary>
    <div class="body"><section class="block"><div class="label">題目</div>${q.context?`<p class="context">${txt(q.context)}</p>`:''}<div class="question">${txt(q.question)}</div>${table(q.extra)}</section>
    <section class="block"><div class="label">答案重點</div><div class="answer">${list(q.answer)}</div></section>
    <section class="block"><div class="label">分析</div>${list(q.analysis)}</section></div></details>`).join(''):'<div class="empty">沒有符合的題目</div>';
}
$('search').addEventListener('input',render);
$('expand').addEventListener('click',()=>{const all=[...document.querySelectorAll('details.card')];const shouldOpen=!all.every(d=>d.open);all.forEach(d=>d.open=shouldOpen);$('expand').textContent=shouldOpen?'全部收起':'全部展開'});
render();
</script></body></html>
