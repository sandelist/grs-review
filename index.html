<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002C55"><title>四卷複習</title>
<style>
:root{--blue:#002C55;--gold:#FFD446;--white:#FFF;--line:rgba(255,255,255,.25);--subtle:rgba(255,255,255,.75)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--blue);color:var(--white);font:16px/1.78 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:min(900px,100%);padding:0 24px;margin:auto}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(120px,1.6fr);border-bottom:1px solid var(--line);margin-top:28px}
.tab{position:relative;display:flex;align-items:center;justify-content:center;gap:11px;padding:15px 8px 18px;border:0;background:transparent;white-space:nowrap;color:var(--subtle)}
.tab span{font-size:18px;font-weight:690;letter-spacing:.03em}
.tab b{font-size:13px;font-weight:550;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--white)}
.tab[aria-selected="true"]:after{content:"";position:absolute;bottom:-1px;left:30%;right:30%;height:2px;background:var(--gold)}
.tab:hover{color:var(--white)}
.tab:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding-top:32px;padding-bottom:100px}
.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;padding-bottom:22px}
.paper-info{display:flex;align-items:baseline;gap:15px}
h1{font-size:25px;line-height:1.3;font-weight:710;margin:0;letter-spacing:.02em}
.count{font-size:13px;color:var(--subtle)}
.tools{display:flex;align-items:center;gap:12px}
input{width:156px;min-width:0;padding:8px 10px;background:transparent;border:1px solid var(--line);border-radius:0;outline:none;font-size:14px}
input::placeholder{color:var(--subtle);opacity:1}
.action{background:transparent;border:1px solid var(--line);padding:8px 11px;font-size:13px;border-radius:0}
#content{display:block}
details.card{border-top:1px solid var(--line)}
details.card:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;padding:17px 2px}
summary::-webkit-details-marker{display:none}
.code{font-size:17px;font-weight:720;min-width:58px}
.heading{font-size:16px;font-weight:630;flex:1;line-height:1.45;min-width:0}
.marks{color:var(--subtle);font-size:12px;white-space:nowrap}
.arrow{font-size:19px;line-height:1;opacity:.7;transition:transform .2s}
details[open] .arrow{transform:rotate(180deg)}
.body{padding:5px 7px 29px 73px}
.block{margin:0 0 25px}
.block:last-child{margin-bottom:0}
.label{font-size:12px;font-weight:650;color:var(--subtle);letter-spacing:.03em;margin-bottom:6px}
.question{white-space:pre-line;overflow-wrap:anywhere;line-height:1.85}
.context{white-space:pre-line;margin:0 0 13px;color:var(--subtle);font-size:14px;line-height:1.8}
.bullets{padding:0;margin:0;list-style:none}
.bullets li{position:relative;line-height:1.85;padding:3px 0 3px 15px;overflow-wrap:anywhere}
.bullets li:before{content:"";position:absolute;top:15px;left:0;width:4px;height:4px;border-radius:50%;background:var(--white)}
.data{border-collapse:collapse;width:100%;margin:15px 0;font-size:13px}
.data td{border:1px solid var(--line);padding:7px 9px}
.data tr:first-child{font-weight:700}
.empty{color:var(--subtle);text-align:center;padding:40px 0}
@media(max-width:600px){
 .wrap{padding:0 16px}nav{margin-top:8px;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(88px,1.5fr)}.tab{padding:15px 4px 16px;gap:8px}.tab span{font-size:17px}.tab b{font-size:12px}
 main{padding-top:25px;padding-bottom:70px}.controls{align-items:flex-start;gap:13px}.paper-info{gap:10px}h1{font-size:22px}
 .tools{gap:9px;width:100%}.tools input{flex:1;width:auto}.tools .action{white-space:nowrap}
 summary{gap:8px;padding:15px 0}.code{min-width:49px;font-size:15px}.heading{font-size:15px}.marks{font-size:11px}.arrow{font-size:17px}
 .body{padding:3px 0 27px 0}.question,.bullets li{font-size:14px}.context{font-size:13px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{body{background:var(--white);color:var(--blue)}nav,.tools{display:none}details.card>.body{display:block!important}details.card{break-inside:avoid}}

.tab.plan-tab span{font-size:16px;letter-spacing:0}
.plan-lang{display:flex;gap:8px;align-items:center}
.plan-lang[hidden]{display:none}
.lang-button{border:0;border-bottom:1px solid transparent;background:transparent;color:var(--subtle);padding:7px 4px;font-size:13px;white-space:nowrap}
.lang-button[aria-pressed="true"]{color:var(--white);border-color:var(--gold)}
.heading-en{display:block;color:var(--subtle);font-size:12px;font-weight:460;line-height:1.5;margin-top:2px}
.plan-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}
.plan-columns.single{grid-template-columns:minmax(0,1fr)}
.plan-text{min-width:0}
.plan-label{color:var(--subtle);font-size:12px;margin-bottom:8px}
.plan-paragraph{margin:0;font-size:15px;line-height:1.9;overflow-wrap:anywhere}
.plan-paragraph[lang="en"]{line-height:1.8}
@media(max-width:700px){.plan-columns{grid-template-columns:minmax(0,1fr);gap:24px}.tab.plan-tab span{font-size:14px}.plan-paragraph{font-size:14px}}
@media(max-width:600px){.controls{align-items:flex-start}.tools{flex-wrap:wrap}.plan-lang{width:100%;justify-content:flex-start}.tab.plan-tab{padding-left:1px;padding-right:1px}.tab.plan-tab span{font-size:13px}}
</style></head>
<body><div class="wrap"><nav id="nav" aria-label="選擇試卷"></nav>
<main><div class="controls"><div class="paper-info"><h1 id="title"></h1><span id="count" class="count"></span></div>
<div class="tools"><div id="plan-lang" class="plan-lang" hidden></div><input id="search" type="search" placeholder="搜尋" aria-label="搜尋題目"><button id="expand" type="button" class="action">全部展開</button></div></div>
<section id="content" aria-live="polite"></section></main></div>
<script>
const PAPERS=[{"id":"A","score":55,"name":"招生與現場應變","items":[{"id":"A1","title":"跨校區招生與服務","marks":40,"lang":"中文","question":"澳大正推進五年發展規劃及研究生教育。部分研究生已在橫琴過渡期辦學點上課或研究，亦已有學生在當地住宿；這不等於新合作區校區已全面建成。\n\n假設研究生院須在現有人手及預算下，協助增加合資格研究生申請及最終入學人數，同時維持主校區和橫琴辦學點的服務質素。作為行政人員，你認為最需要處理哪三項行政挑戰？請逐項說明其影響及可行措施，列明主要協作單位，並解釋你會優先處理哪一項。最後提出兩項可量度指標：一項反映招生或入學成效，另一項反映服務或資訊質素。\n\n毋須假設兩地所有程序都不同，也毋須背誦具體出入境法規或內部KPI；重點是說明哪些事項需要核實、如何協調及跟進。","answer":["提出兩地規則與私隱、橫琴學生求助、查詢量與人手三項挑戰。","建議跨校區調配人手、加強溝通，以及以AI chatbot協助回覆查詢。","以每年入學人數和新生服務滿意度作指標。"],"analysis":["能辨識合規與服務需要，兩項指標合理。","部分挑戰重疊；協作方法仍可具體化。","原稿未明確寫出最優先處理哪項挑戰及理由。"]},{"id":"A2(a)","title":"Pre-event preparation","marks":10,"lang":"English","question":"Identify five essential pre-event checks. For each, name the person or team you would involve. Cover programme information and materials, speakers and duties, and the practical arrangements for running the sessions.","answer":["Check internet and computer connections with ICTO.","Confirm presentation topics with academic representatives and arrange a joint test.","Check that the slides are up to date and coordinate publicity with the Communications Office."],"analysis":["The technical, speaker and presentation checks are specific and practical.","The response could also clarify who handles typed questions, session handovers and escalation."],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A2(b)","title":"Speaker loses connection","marks":10,"lang":"English","question":"Five minutes into the second session, the speaker loses the connection. A backup slide deck is available, but the reconnection time is unknown. Explain your immediate response and how you would protect the remaining programme and inform participants.","answer":["Inform participants through the live chat.","Use the backup slides and invite another prepared speaker to present first.","Allow the disconnected speaker to resume once their connection is restored."],"analysis":["Reordering speakers is a reasonable contingency.","The answer could add technical reconnection steps, a time limit and follow-up for unanswered questions."],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A2(c)","title":"Outdated slide","marks":10,"lang":"English","question":"A reused slide states that all teaching is on the main campus and that every successful applicant receives a full scholarship. The current approved programme information does not support either statement. Viewers have already seen the slide. What would you do during the session and afterwards?","answer":["No answer was written."],"analysis":["Stop using the incorrect slide and clarify the teaching-location and scholarship claims immediately.","After checking the approved information, correct the slides, recording and FAQs, and follow up with affected viewers."],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A2(d)","title":"Privacy in a public chat","marks":10,"lang":"English","question":"An applicant posts a passport image and examination results in the public chat and asks staff to guarantee admission and a Hengqin room immediately. Explain how you would protect the applicant while providing a useful response and arranging follow-up.","answer":["Ask the applicant to stop sharing personal information in the public chat.","Remind other participants not to take screenshots.","Explain that the application will be assessed through the normal process."],"analysis":["The response shows awareness of privacy risks.","It should also arrange removal of the exposed information and move follow-up to a secure, private channel.","Neither admission nor accommodation can be guaranteed; provide a practical next step instead."],"context":"Hypothetical scenario: GRS, the Communications Office and three academic units will run consecutive postgraduate recruitment livestreams for prospective students in the Chinese mainland. Sessions run from 14:00 to 17:00. Each unit has 50 minutes for a presentation and questions, followed by a 10-minute changeover. Professors speak while GRS staff also answer typed questions. You coordinate the event; you do not approve admissions or funding."},{"id":"A3","title":"AI in admissions administration","marks":20,"lang":"English","question":"Following the livestreams, GRS has approved programme information, chat records containing personal details, unanswered enquiries and participation figures. A colleague proposes uploading all records to a free public AI tool to generate replies automatically.\n\nDesign a safer workflow. State three useful AI applications and three specific safeguards, and identify who should check and authorise applicant-facing outputs. Explain how unresolved academic or admissions questions would be handled rather than automatically answered.\n\nNo product names or programming knowledge are required. Your response should explain a workable division between AI assistance and human responsibility.","answer":["Remove personal data before uploading records.","Use only approved AI tools.","Have GRS staff and supervisors check applicant-facing outputs."],"analysis":["Interpreting the workflow as the handling of applicant enquiries is reasonable.","However, the question explicitly requests three AI uses and a process for unresolved enquiries; these were not fully developed.","Acceptable uses include categorising enquiries, identifying repeated questions and drafting replies from approved information."]}]},{"id":"B","score":63,"name":"個人經驗與發展","items":[{"id":"B1","title":"經驗如何支持研究生院","marks":40,"lang":"中文","question":"在你過去的學習及工作經歷中，哪一段經歷最有助你勝任澳門大學研究生院的行政工作？\n\n請以兩個真實工作或學習例子，說明你採取的行動、取得的結果或所得的經驗，再歸納三項可轉用於研究生院的能力。其應用須同時涉及招生推廣及至少一項非宣傳的研究生院工作，並考慮主校區與橫琴辦學點的需要。\n\n最後指出一項你仍需補足的研究生行政知識，以及入職後如何有系統地學習。\n\n不要求曾經做過研究生招生或學籍工作。只採用自己的真實經驗；不能量化的成果，可用已完成的工作、問題改善或回饋說明，不必虛構數字。","answer":["以大學傳訊部的校園記者計劃為例，介紹工作坊、典禮、學生文案指導及歸屬感。","分享每年處理約200至300份校園記者申請、分類及data cleansing的經驗。","歸納溝通、數據整合、文字撰寫能力；建議親自模擬一次研究生申請流程。"],"analysis":["工作例子具體，既有傳訊也有申請資料管理。","已充分考過個人工作能力，不宜在D卷原樣重考。","若直接應用到研究生院，應更清楚交代所屬工作流程及服務對象。"]},{"id":"B2","title":"Three priorities for the year","marks":60,"lang":"English","question":"UM’s Five-Year Development Plan places postgraduate education within the development of an international comprehensive research university. It combines growth and international cooperation with stronger education and quality assurance. Postgraduate teaching, research and residential life are already taking place at transitional sites in Hengqin.\n\nWith limited staff and resources, what three priorities would you recommend for the Graduate School over the next twelve months? At least one should address recruitment and at least one should address the experience, academic progress or development of enrolled postgraduate students. The third is your choice.\n\nFor each priority, explain why it matters, propose practical actions, identify the main partners and give one measurable outcome. Relate your recommendations to UM’s five-year direction and the needs of students across Macao and Hengqin. Conclude by explaining how you would prioritise resources without sacrificing fairness or educational quality.\n\nYou may build on existing activities, including mainland recruitment, online briefings, international outreach and academic support. Do not assume these activities are absent. No particular combination of initiatives is the only correct answer; marks reward justified choices and workable execution. You are not required to invent institutional targets.","answer":["Introduce residential college life through briefings with college representatives, and use surveys to assess interest.","Promote international exchange opportunities with the Global Affairs Office and academic units.","Explore joint postgraduate programmes with overseas universities and track indicators such as applications.","Prioritise an online residential college briefing because it is relatively inexpensive and easy to deliver."],"analysis":["The response already shows ideas for international exchange and overseas collaboration.","It focuses more on promotion, applications and partnerships than on postgraduate learning outcomes and supporting evidence.","Later practice should therefore focus on comparing international support systems rather than repeating three internationalisation proposals."]}]},{"id":"C","score":67,"name":"學生服務與數據","items":[{"id":"C1","title":"橫琴博士生複合查詢","marks":30,"lang":"中文","question":"模擬情境：一名博士生部分教研活動在橫琴辦學點進行，並已入住當地學生公寓。他向研究生院反映，兩份通知列出的進度報告期限不同，導師尚未回覆其查詢，他擔心影響資助；另外，他對下週主校區活動的交通安排及可使用的支援服務感到不清楚。\n\n你是首先收到查詢的研究生院行政人員。請提出有先後次序的處理方案，涵蓋即時回應、期限及進度程序核實、與導師／學院及相關行政單位的協調、生活與跨校區資訊，以及後續跟進。\n\n說明哪些事項可由你直接協助，哪些須經相關單位確認或批准。不得僅把學生轉介後便結束，也不得自行延長期限或裁定其資助結果。\n\n題目未提供學生所屬資助計劃或最終適用期限；不要求猜測。毋須引用條文編號，也不應把另一校區當作另一所大學。","answer":["向學術單位核實進度期限，並請相關人員聯絡導師。","向交通／活動單位了解安排，再以電郵回覆學生。","不自行裁定資助，維持聯絡並待進一步核實。"],"analysis":["有核實權限、聯絡對口及跟進的基本思路。","可更明確把報告期限及資助風險列為優先處理事項。","轉介後仍要由接案人追蹤回覆，不宜只等待其他單位。"]},{"id":"C2(a)","title":"Two-university recruitment itinerary","marks":15,"lang":"English","question":"Propose a realistic programme from 09:30 to 16:30, preserving both briefings and allowing preparation, lunch, transfers and a reasonable buffer. State the main recruitment purpose in one sentence. Do not add unrelated visits.","answer":["Plan preparation at 09:30, University A’s briefing from 10:00 to 11:00, the transfer to University B and lunch, University B’s briefing from 14:00 to 15:00, and travel to the border checkpoint.","The main purpose is to promote UM postgraduate programmes."],"analysis":["The answer brings scheduled activities and travel into a workable day plan.","Check that transfers, lunch and arrival at the checkpoint leave enough time for contingencies."],"context":"Hypothetical scenario: a GRS team and academic representatives are already in Zhuhai for two university recruitment briefings. University A’s session is fixed at 10:00–11:00 and University B’s at 14:00–15:00. Transfer from A to B takes 45 minutes; travel from B to the departure border checkpoint takes 60 minutes. The team must reach that checkpoint by 16:30. A working lunch and preparation time are needed."},{"id":"C2(b)","title":"Pre-visit checks","marks":10,"lang":"English","question":"State three grouped preparation checks. Cover (i) the agreed agenda, speakers and approved materials; (ii) transport and travel-document arrangements; and (iii) meal timing, numbers and dietary requirements. Name the relevant contacts or responsible parties, and include a backup for one critical arrangement.","answer":["Confirm speakers’ topics, FAQs and approved presentation materials.","Remind participants to bring travel documents and confirm the itinerary with the driver.","Check the meal headcount and dietary needs, and propose a backup driver."],"analysis":["The checks cover materials, transport and catering.","A stronger concise answer would name the person responsible for each check and the key backup arrangement."],"context":"Hypothetical scenario: a GRS team and academic representatives are already in Zhuhai for two university recruitment briefings. University A’s session is fixed at 10:00–11:00 and University B’s at 14:00–15:00. Transfer from A to B takes 45 minutes; travel from B to the departure border checkpoint takes 60 minutes. The team must reach that checkpoint by 16:30. A working lunch and preparation time are needed."},{"id":"C3(a)","title":"Postgraduate recruitment announcement","marks":20,"lang":"English","question":"Use only this hypothetical fact sheet to write a short recruitment announcement for UM’s website (100–120 words including the headline). Do not add a URL or hashtags. Include a clear headline, relevant benefits for prospective postgraduate students and a specific next step. Do not invent course titles, rankings, speakers, quotations or confirmed benefits.","answer":["Draft an announcement for the online Mandarin postgraduate information session on 5 November, 19:00–20:00, covering AI, engineering and design, registration and the deadline.","Mention research opportunities and arrangements in Macao and Hengqin."],"analysis":["Most of the essential event information is included.","The question explicitly prohibits a URL, but the handwritten draft includes the placeholder “http:xxxx”.","A free event should not be confused with free admission or tuition; unconfirmed benefits must not be invented."],"extra":[["Event","Postgraduate Study at UM: Information Session"],["When / format","5 November 2026, 19:00–20:00, Beijing/Macao time; online, in Mandarin"],["Speakers / topics","GRS and academic representatives; artificial intelligence, engineering and design; applications, research opportunities and study arrangements across Macao and Hengqin"],["Attendance","Free; register through UM’s official event registration page by 17:00 on 3 November"],["Limits","Teaching location depends on the programme and confirmed arrangements. No guaranteed admission, scholarship or accommodation is announced."]]},{"id":"C3(b)","title":"Reply to a conditional-offer applicant","marks":15,"lang":"English","question":"Today is 6 November in this hypothetical case. An applicant’s conditional offer requires a final transcript by 10 November through the official system, but their current university says it can issue it only on 18 November. The applicant asks you to approve an extension and confirm funding and accommodation, neither of which has been individually confirmed. Draft a helpful email reply explaining the next steps and what remains subject to confirmation. You may not approve exceptions yourself.","answer":["Explain that funding and accommodation cannot yet be guaranteed.","Ask for evidence of the delayed transcript and indicate that the case will be reviewed and followed up."],"analysis":["Avoiding unauthorised promises is appropriate.","The reply should explain the conflict between the 10 November deadline and the expected transcript date of 18 November, and clarify that an authorised unit must approve any extension.","It could also give a secure submission channel and a follow-up timeframe."]},{"id":"C4","title":"招生推廣數據","marks":10,"lang":"中文","question":"以下均為模擬數據：兩個已完成的招生推廣組別採用相同統計定義及同樣的觀察期。各組內已去除重複人士，已完成申請及符合基本資格的申請均可追溯至該組參與者。組別並非隨機分配，尚無錄取或註冊結果。\n\n(a) 分別計算甲、乙兩組的「完成申請／參與者」比例，以及「符合基本資格／完成申請」比例。\n(b) 有人說：「乙組參與者較多，所以招生一定更成功。」你是否同意？用數據說明，並指出一項比較限制。\n(c) 提出一項可跟進的改善措施及一項後續成效指標。不要把符合基本資格等同獲錄取。","answer":["計算甲、乙兩組申請轉換率及合資格比例。","認為不能單憑觀看／參與人數判斷成效，應觀察申請及資格結果。","建議改善網上申請流程與文件提交。"],"analysis":["完成申請率正確應為甲40÷400＝10%、乙48÷800＝6%；原稿寫成1%和0.6%。","合資格／完成申請比例為甲30÷40＝75%、乙24÷48＝50%，原稿這兩項正確。","參與者較多不等於招生更成功；最終錄取和註冊結果尚未提供。"],"extra":[["組別","獨立參與者","完成申請","符合基本資格的申請"],["甲","400","40","30"],["乙","800","48","24"]]}]},{"id":"D","score":69,"name":"國際研究與資料核實","items":[{"id":"D1","title":"個人經驗與研究生支援","marks":40,"lang":"中文","question":"請從你親身的研究生學習或專業服務經驗中，選擇一項值得借鑑的做法，說明如何把它適當地應用於澳門大學的研究生支援。","answer":["分享在利物浦大學網上修讀研究生課程時，使用Libby服務遇到問題而向支援團隊查詢。","大約一個工作天獲得有禮回覆，對方解釋權益並轉介資訊科技部門，問題很快解決。","由此歸納同理心、及時回覆、不越權及跨部門協助。"],"analysis":["成功運用真實海外研究生經驗，而非重用B1工作履歷。","可進一步把服務原則落到研究生院的明確查詢渠道、回覆時限與轉介跟進。"]},{"id":"D2","title":"International postgraduate support research","marks":35,"lang":"English","question":"The Dean asks you to investigate how overseas universities support international postgraduate students during their first semester. Explain how you would conduct this study and use its findings to advise UM.","answer":["Start by reviewing information from universities in the QS and THE top 50.","Collect details of accommodation, financial assistance, mental health support, programme choices and exchanges.","Use AI to assist research, then organise the findings in Excel, Power BI or presentations and discuss feasible practices with the Dean and academic units."],"analysis":["The response outlines a basic process for finding, organising and presenting information.","High ranking does not necessarily mean effective first-semester support; comparability matters when selecting universities.","Official websites can show that a service exists but not that it works; student feedback or evaluation evidence would strengthen the findings."]},{"id":"D3","title":"Verification of doctoral degree data","marks":25,"lang":"English","question":"UM's Rector's Office is preparing postgraduate data for a university-level ranking submission and asks GRS to confirm the number of doctoral degrees formally awarded in calendar year 2025. GRS's approved degree-award register records 186 such awards, while a spreadsheet from academic units lists 211 students who completed doctoral requirements during academic year 2024/25. Your GRS supervisor asks you to examine the two records before any official response is sent to the Rector's Office. How would you establish and document the appropriate figure for your supervisor?","answer":["Check the calculations in the GRS spreadsheet.","Request student records from academic units, compare the entries, verify the figures and document the process.","Submit the findings to the supervisor for confirmation before responding to the Rector’s Office."],"analysis":["The key distinction is that 186 refers to doctoral degrees formally awarded in calendar year 2025, while 211 counts students completing requirements during academic year 2024/25. Both the time period and the event being counted differ.","Different totals do not necessarily indicate missing students, and the two figures should not automatically be reconciled to the same number.","Verify the source of the 186 awards, the formal award dates and any amendments before presenting the result to the supervisor. Her separate GPT awarded 69/100 overall but acknowledged overlooking the calendar-year versus academic-year distinction."]}]}];
const PLAN=[{"id":"01","title":"研究生教育方向","titleEn":"Postgraduate education strategy","tag":"教育","cn":"研究生教育水平決定一流大學的辦學格局，更是大學深度融入區域經濟社會發展、全球創新網絡、貢獻人類知識前沿的重要路徑。因應全球對國際化創新人才的迫切需求，澳大將以全球融合、卓越發展為引領，以深化國際合作、優化培養體系、強化質量保障為重點，推進研究生教育國際化進程， 並持續提升研究生培養水平。","cnPdfPages":[26],"cnPages":[23],"en":"Postgraduate education determines the overall academic standing of a first-class university and is its primary channel for contributing to regional economic and social development, global innovation networks and the advancement of knowledge. In response to global demand for internationally oriented and innovation-driven talent, the University will be guided by its commitment to global connection and pursuit of excellence, while placing emphasis on enhancing international cooperation and on strengthening education and quality assurance systems. This aims to promote the internationalisation and quality of its postgraduate education.","enPdfPages":[24],"enPages":[23]},{"id":"02","title":"研究生規模與發展目標","titleEn":"Postgraduate population and targets","tag":"規模","cn":"未來五年，澳大將對標國際化綜合性研究型大學，通過適度擴大辦學規模，實現從“精品特色”向“綜合卓越”的轉型。核心目標是總體學生人數於2035 年達到25,000 人，形成具備競爭力的中等辦學體量。預計2030/31 學年總學生規模達到22,211 人。主校區為18,244 人（其中有2,000 人同時在兩個校區上課及開展科研），合作區校區為3,967 人。大學的研究生佔比達到 55%左右，人文社科類與理工醫藥類的學生規模比例為1:1，實現綜合性研究型大學的人才結構特徵。","cnPdfPages":[24],"cnPages":[21],"en":"In the next five years, benchmarking against international comprehensive research universities, UM will pursue moderate expansion and transition from ‘niche expertise’ to ‘a university of excellence with comprehensive strengths’ through measured enrolment growth. The core goal is to reach a total student population of 25,000 in 2035, thus becoming a competitive medium-scaled institution. In the academic year 2030/31, the total number of students is expected to reach 22,211, with 18,244 enrolled on the main campus (including 2,000 students attending classes and conducting research on both campuses simultaneously) and 3,967 enrolled on the Cooperation Zone campus. Postgraduate students will account for approximately 55% of the total student population. The ratio between humanities and social sciences students and science, engineering and medicine students will be 1:1, reflecting the student mix of a comprehensive research university.","enPdfPages":[22],"enPages":[21]},{"id":"03","title":"碩士國際招生策略","titleEn":"International master’s recruitment","tag":"招生","cn":"優化招生策略，拓展碩士課程的國際生源。以提升學術聲譽與優化招生流程為核心，突破生源瓶頸，應對激烈競爭，大學將實施以下相關招生策略 ——與內地一流高校建立優秀學生推薦機制，針對目標院校進行精準宣傳， 並為個別課程制定宣傳規劃；聚焦亞洲國家如馬來西亞、越南等進行宣傳， 並積極參與國際教育展；與國外院校開展雙學位課程或學生交流計劃，吸引國外院校的本科生報讀澳大；集中宣傳特色學科及熱門學科；招生宣傳會加入體驗元素，展現教學特色及研究水平；優化收生程序，建立新招生指標。","cnPdfPages":[26],"cnPages":[23],"en":"Optimising recruitment strategies to expand international student sources for master’s programmes. To enhance academic reputation, optimise admission processes and address student source limitations amid intense competition, the University will implement the following admission strategies: establishing an outstanding student recommendation mechanism with leading institutions in the Chinese Mainland, developing customised publicity campaigns for targeted institutions and specific programmes; focusing promotional efforts on Asian countries such as Malaysia and Vietnam and actively participating in international education fairs; launching dual degree and student exchange programmes with overseas partners to attract international undergraduates; increasing publicity for signature and high-demand disciplines; adding experiential elements in recruitment events to showcase UM’s education strengths and research capacity; streamlining admission processes and establishing new recruitment indicators.","enPdfPages":[24,25],"enPages":[23,24]},{"id":"04","title":"研究生住宿書院","titleEn":"Postgraduate residential colleges","tag":"支援","cn":"建設研究生住宿書院。基於紹邦書院“研究生書院教育試點計劃”，澳大將建設“創新與跨領域交流”、“卓越研究”、“全球交流”等主題書院， 以協同創新研究院的學生、澳大人才計劃的博士生、國際生及交流生為主要入住群體。書院將深度融合澳大現有住宿書院系統的成功基因，並借鑒劍橋大學克萊爾學堂等世界一流研究生書院的先進理念，設計“核心課程模塊” 與“書院特色活動”，為研究生提供以學生為中心、立足社區，支持卓越研究、創新與國際化的教育平台。","cnPdfPages":[26],"cnPages":[23],"en":"Developing postgraduate residential colleges. Building on Siu Pong College’s ‘Postgraduate Residential College Education Pilot Programme’, the University will develop new colleges centred on the themes ‘Innovation and Interdisciplinary Exchange’, ‘Research Excellence’, and ‘Global Engagement’. Their main residents will be students from the Institute of Collaborative Innovation, doctoral students under the UM Talent Scheme and international and exchange students. The colleges will combine the proven strengths of UM’s existing residential college system with best practices from world-class graduate colleges such as Clare College of the University of Cambridge, and will deliver ‘core curriculum modules’ and ‘college signature events’. They will provide postgraduate students with a student-centred, community-based educational platform for research of excellence, innovation, and internationalisation.","enPdfPages":[25],"enPages":[24]},{"id":"05","title":"博士培養、數碼管理及交流","titleEn":"Doctoral training and digital administration","tag":"教育","cn":"系統推進研究生教育管理體系的改革。面向社會需求，打破傳統博士生培養的單一學術導向，推動“轉化研究”單元納入博士課程。升級數字系統， 構建“數據驅動”治理，推出“線上論文典試委員會提交系統”，並在研究生管理系統中深度整合“畢業生職業發展追踪模塊”；持續收集學術單位及研究生的反饋，不斷優化研究生相關制度與流程。同時，建立大學層面的博士研究交流計劃，使博士生能參與國家級學術項目及世界級產業研究項目。","cnPdfPages":[27],"cnPages":[24],"en":"Systematically reforming the postgraduate education management system. In response to societal needs, UM will move beyond the traditional single-focus on scholarly work in doctoral education by incorporating a ‘translational research’ module into doctoral curricula. It will upgrade its digital infrastructure to promote data-driven governance by launching an ‘online thesis submission system’ and embedding a ‘graduate career development tracking module’ into the graduate management platform. The University will continue to collect feedback from academic units and postgraduate students to refine postgraduate policies and processes. Concurrently, a university-level doctoral research exchange programme will be established to enable doctoral candidates to participate in national academic projects and world-class industry research initiatives.","enPdfPages":[25],"enPages":[24]},{"id":"06","title":"課程審視與質量保障","titleEn":"Programme review and quality assurance","tag":"教育","cn":"此外，大學將依據《高等教育制度》及《高等教育素質評鑑制度》，適時開展課程審視及院校素質核證工作，持續提升學術水平和教學質量。","cnPdfPages":[23],"cnPages":[20],"en":"In addition, UM will conduct timely programme reviews and institutional quality assurance processes in accordance with the ‘Higher Education Regime’ and the ‘Higher Education Quality Evaluation System’ to steadily elevate academic standards and teaching quality.","enPdfPages":[22],"enPages":[21]},{"id":"07","title":"國際碩士獎助學金","titleEn":"Scholarships for international master’s students","tag":"招生","cn":"在激勵機制建設上，優化獎助學金體系，豐富獎助學金種類、提高資助額度，為國際碩士生設立A、B、C 類獎學金，覆蓋學費、生活費等核心支出， 同時為來校學期交流、暑期研習的國際學生提供多元化獎助支持，切實增強對全球優秀人才的吸引力，助力吸納更多來自合作院校的優質生源。","cnPdfPages":[42],"cnPages":[39],"en":"Enhancing incentive mechanisms. The University will refine its scholarship and assistantship system by broadening the range of awards and increasing funding amounts. A categorised scholarship scheme (Categories A, B and C) will be established for international master’s students, covering key expenses such as tuition fees and living costs. In addition, diversified financial support will be provided for international students participating in semester exchanges and summer programmes at UM. These measures will effectively enhance the University’s attractiveness to outstanding global talent and facilitate the recruitment of high-quality students from partner institutions.","enPdfPages":[41],"enPages":[40]},{"id":"08","title":"國際招生與審批流程","titleEn":"International admissions processes","tag":"招生","cn":"在管理流程優化上，針對與國內外合作院校的交流項目、國際招生等工作簡化內部行政流程，改組大學層面的招生委員會，協同相關職能部門開展工作，提升決策效率與科學性。","cnPdfPages":[42],"cnPages":[39],"en":"Optimising the management processes. The University will streamline internal administrative procedures for exchange programmes with domestic and international partner institutions, as well as for international student recruitment. The University will restructure the university-level admissions committee to coordinate relevant functional units, thereby enhancing the efficiency and scientific soundness of decision-making.","enPdfPages":[41],"enPages":[40]},{"id":"09","title":"聯合培養學生全程支援","titleEn":"Support throughout joint programmes","tag":"支援","cn":"在服務保障升級上，強化與內地高校、葡（西）語系及英語系國家合作院校聯合培養學生的全過程管理與精細化服務，完善跨校學分互認、學籍管理、住宿安排、文化適應指導等配套服務；建立合作成效評估反饋體系，定期梳理與各夥伴院校在雙學位、科研項目、學術交流等項目上的合作成果， 跟蹤項目實施進度，不斷優化合作策略與服務舉措。","cnPdfPages":[42],"cnPages":[39],"en":"Upgrading support. The University will strengthen whole-process management and provide more refined services for students participating in joint training programmes with partner institutions in the Chinese Mainland, as well as in Portuguese-, Spanish- and English-speaking countries. It will enhance supporting arrangements such as cross-university credit transfer, student records management, accommodation and cultural orientation. In parallel, a feedback and evaluation mechanism will be established to assess the effectiveness of partnerships, to regularly review collaborative outcomes of dual degree programmes, research projects and academic exchanges with partner institutions, and to monitor implementation progress, thereby continuing to refine the partnership strategies and support measures.","enPdfPages":[41],"enPages":[40]},{"id":"10","title":"國際化戰略4S、4地區、4目標","titleEn":"Internationalisation: 4S, 4 Zones, 4 Aims","tag":"國際","cn":"澳門大學將明確國際化戰略、重心與目標，透過“4S  4Zones  4Aims ”， 充分發揮澳大國際化優勢與特色，全面提升大學課程、生源、師資與合作項目的質量，打造國際化、協作化、動態活力的教研樞紐。  4S（4S 戰略）：澳大繼續推行“4S”國際化戰略——“Strategic（戰略性）”、“Substantial（實質性）”、“Specific（具體性）”、 “Sustainable（可持續性）”  4Zones（4 地區）：面向“4 個重點地區”——葡（西）語系國家、 英語系國家、“一帶一路”沿線國家與亞太鄰近國家、中國內地及香港地區（C9+及一流大學）  4Aims（4目標）：緊扣“4個國際目標”——國際師資、國際課程、 國際學生與國際交流","cnPdfPages":[39],"cnPages":[36],"en":"The University of Macau will specify its internationalisation strategy, priorities and objectives. Through the ‘4S • 4 Zones • 4 Aims’ framework, the University will fully capitalise on its strengths and distinctive features in internationalisation to comprehensively enhance the quality of its programmes, student intake, faculty and collaborative initiatives. In doing so, it aims to establish itself as an internationally oriented, collaborative and dynamic hub for teaching and research.  4S Strategy: UM will continue to implement the ‘4S’ internationalisation strategy — ‘Strategic’, ‘Substantial’, ‘Specific’ and ‘Sustainable’.  4 Zones: Targeting four key regions — Portuguese- and Spanish-speaking countries, English-speaking countries, countries along the ‘Belt and Road’, neighbouring countries in the Asia-Pacific region, and the Chinese Mainland and the Hong Kong SAR (C9+ and top universities).  4 Aims: Focusing on four internationalisation objectives — international faculty members, internationalised programmes, international students and international exchange.","enPdfPages":[38],"enPages":[37]},{"id":"11","title":"全球合作夥伴網絡","titleEn":"Global partnership network","tag":"國際","cn":"大學將全方位推進合作網絡建設，目標是構建覆蓋全球超過40 個國家和地區、合作院校超過400 所的高質量國際合作網絡，全面提升國際合作範圍與深度，穩步增強國際招生與品牌影響力。","cnPdfPages":[39],"cnPages":[36],"en":"UM will adopt a comprehensive approach to advancing its partnership network, with the aim of establishing a high-quality global network spanning over 40 countries and regions and more than 400 partner institutions. It will broaden and deepen international collaboration, while steadily increasing international student recruitment and elevating its global profile and influence.","enPdfPages":[38],"enPages":[37]},{"id":"12","title":"國際雙學位及聯合培養","titleEn":"International dual degrees and joint training","tag":"國際","cn":"大學未來五年致力推動實現“每個學院/研究院/書院均設有國際項目”。 其中，重點推動合作區校區的醫學院、信息學院、工學院、設計學院開展國際雙學位項目。","cnPdfPages":[40],"cnPages":[37],"en":"Over the next five years, UM will work towards ensuring that each faculty, institute and residential college offers international programmes. In particular, priority will be given to developing international dual degree programmes in the Faculty of Medicine, the Faculty of Information Science and Computing, the Faculty of Engineering, and the Faculty of Design on the Cooperation Zone campus.","enPdfPages":[39],"enPages":[38]},{"id":"13","title":"國際學生及師生交流","titleEn":"International student and academic exchanges","tag":"國際","cn":"推動師生流動常態化。一方面鼓勵本校優秀學生赴內地一流高校及國際夥伴院校，開展短期訪學、交換學習，參與對方的科研項目與學術活動，拓寬本土學生的視野與格局；另一方面擴大暑期研習營、短期學術訓練營等活動規模，優化活動內容設計，吸引全球合作院校學生來校交流，增進國際學生對澳大及澳門的認識，構建長期、可持續的學術協作與人文紐帶。","cnPdfPages":[42],"cnPages":[39],"en":"Promoting staff and student mobility as a regular practice. On the one hand, UM will encourage outstanding students to undertake short-term study visits and exchange programmes at leading universities in the Chinese Mainland and partner institutions overseas, and to participate in their research projects and academic activities, thereby broadening their perspectives and visions. On the other hand, it will expand the scale of summer camps, short-term academic training programmes and similar activities, refine programme design, and attract students from partner institutions worldwide to exchange at UM. These efforts will enhance international students’ understanding of UM and Macao, so as to foster long-term, sustainable academic collaboration and people-to-people ties.","enPdfPages":[40,41],"enPages":[39,40]},{"id":"14","title":"一校兩區統一管理","titleEn":"Unified management across two campuses","tag":"跨境","cn":"大學主校區與合作區校區採取一體化統一管理，管理體制、運作經營、 學生培養及取得學歷均一致。澳大將積極探索實踐一套符合兩地法律要求的一體化管理及營運模式。","cnPdfPages":[49],"cnPages":[46],"en":"The University will implement integrated and unified management across its main campus and the Cooperation Zone campus, ensuring consistency across governance systems, operational models, student education and the awarding of academic qualifications. UM will actively explore and implement an integrated management and operational model that complies with the legal requirements of both jurisdictions.","enPdfPages":[48],"enPages":[47]},{"id":"15","title":"研究生宿舍S5及S6","titleEn":"Postgraduate Houses S5 and S6","tag":"支援","cn":"主校區將持續按計劃有序開展宿舍建造工程，重點是S5 及S6 的研究生宿舍建設，預計2027 年第二季完工，屆時將新增1,007 間學生房間。","cnPdfPages":[49],"cnPages":[46],"en":"On the main campus, accommodation projects will continue to be advanced in line with the established plan, with priority given to the construction of Postgraduate Houses S5 and S6. These are scheduled for completion in the second quarter of 2027, delivering an additional 1,007 student rooms.","enPdfPages":[47],"enPages":[46]},{"id":"16","title":"研究生入學成績單驗真","titleEn":"Postgraduate admission transcript verification","tag":"跨境","cn":"依托“國際跨境可信數據空間—澳琴站”技術支撐， 搭建大學與合作區數據跨境安全監管平台，優先推進研究生入學申請成績單驗真服務，實現學信網驗證及大灣區院校互認。","cnPdfPages":[50,51],"cnPages":[47,48],"en":"Leveraging the technical underpinning of the ‘International Cross-Border Trusted Data Space – Macao-Hengqin Node’, the University will establish a cross‑border data security and regulatory oversight platform between the University and the Cooperation Zone. Priority will be given to implementing a transcript verification service for postgraduate admissions, enabling authentication through the China Higher Education Student Information website and mutual recognition among institutions within the GBA.","enPdfPages":[49],"enPages":[48]}];
const NAV=[...PAPERS,{id:'P',score:'',name:'五年規劃'}];
let current=(location.hash==='#plan'?'P':(/^#[A-D]$/i.test(location.hash)?location.hash.substring(1).toUpperCase():'A'));
let planLang='both';
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt=s=>e(s).replace(/\n/g,'<br>');
const list=a=>'<ul class="bullets">'+a.map(s=>'<li>'+e(s)+'</li>').join('')+'</ul>';
const table=a=>a?'<table class="data">'+a.map(row=>'<tr>'+row.map(s=>'<td>'+e(s)+'</td>').join('')+'</tr>').join('')+'</table>':'';
function renderPlan(){
 $('title').textContent='五年規劃';
 $('plan-lang').hidden=false;
 $('plan-lang').innerHTML=[['both','中英'],['cn','中文'],['en','English']].map(([v,l])=>`<button type="button" class="lang-button" data-lang="${v}" aria-pressed="${v===planLang}">${l}</button>`).join('');
 document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{planLang=b.dataset.lang;render()}));
 const term=$('search').value.trim().toLowerCase();
 const visible=PLAN.filter(q=>!term||[q.title,q.titleEn,q.cn,q.en,q.tag].join(' ').toLowerCase().includes(term));
 $('count').textContent=visible.length+'項';
 $('content').innerHTML=visible.length?visible.map((q,i)=>{
   const cpages=q.cnPages.map(x=>'p.'+x).join('–');
   const epages=q.enPages.map(x=>'p.'+x).join('–');
   const zh=planLang!=='en'?`<div class="plan-text"><div class="plan-label">中文 · ${cpages}</div><p class="plan-paragraph" lang="zh-Hant">${txt(q.cn.replaceAll('  ','\n '))}</p></div>`:'';
   const en=planLang!=='cn'?`<div class="plan-text"><div class="plan-label">English · ${epages}</div><p class="plan-paragraph" lang="en">${txt(q.en.replaceAll('  ','\n '))}</p></div>`:'';
   return `<details class="card" ${i===0?'open':''}><summary><span class="code">${e(q.id)}</span><span class="heading">${e(q.title)}<span class="heading-en" lang="en">${e(q.titleEn)}</span></span><span class="arrow" aria-hidden="true">⌄</span></summary><div class="body"><div class="plan-columns ${planLang==='both'?'':'single'}">${zh}${en}</div></div></details>`;
 }).join(''):'<div class="empty">沒有符合的內容</div>';
 $('expand').textContent='全部展開';
}
function render(){
 $('nav').innerHTML=NAV.map(p=>`<button class="tab ${p.id==='P'?'plan-tab':''}" data-tab="${p.id}" aria-selected="${p.id===current}"><span>${p.id==='P'?'五年規劃':p.id+'卷'}</span>${p.id==='P'?'':`<b>${p.score}</b>`}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.tab;history.replaceState(null,'',current==='P'?'#plan':'#'+current);$('search').value='';render();window.scrollTo(0,0)}));
 if(current==='P'){renderPlan();return;}
 $('plan-lang').hidden=true;
 const p=PAPERS.find(x=>x.id===current);$('title').textContent=p.id+'卷';
 const term=$('search').value.trim().toLowerCase();
 const items=p.items.filter(q=>!term||[q.id,q.title,q.question,q.context||'',...q.answer,...q.analysis].join(' ').toLowerCase().includes(term));
 $('count').textContent=items.length+'題';
 $('content').innerHTML=items.length?items.map((q,i)=>{
  const en=q.lang!=='中文';
  return `<details class="card" ${i===0?'open':''}><summary><span class="code">${e(q.id)}</span><span class="heading">${e(q.title)}</span><span class="marks">${q.marks} ${en?'marks':'分'}</span><span class="arrow" aria-hidden="true">⌄</span></summary>
  <div class="body"><section class="block"><div class="label">${en?'Question':'題目'}</div>${q.context?`<p class="context">${txt(q.context)}</p>`:''}<div class="question">${txt(q.question)}</div>${table(q.extra)}</section>
  <section class="block"><div class="label">${en?'Answer summary':'答案重點'}</div>${list(q.answer)}</section>
  <section class="block"><div class="label">${en?'Analysis':'分析'}</div>${list(q.analysis)}</section></div></details>`;
 }).join(''):'<div class="empty">沒有符合的題目</div>';
 $('expand').textContent='全部展開';
}
$('search').addEventListener('input',render);
$('expand').addEventListener('click',()=>{const all=[...document.querySelectorAll('details.card')];const opening=!all.every(d=>d.open);all.forEach(d=>d.open=opening);$('expand').textContent=opening?'全部收起':'全部展開'});
render();
</script></body></html>
