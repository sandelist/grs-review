const statusEl=document.getElementById('status');
const btn=document.getElementById('unlock');
function fromBase64(b64){const a=atob(b64);const out=new Uint8Array(a.length);for(let i=0;i<a.length;i++)out[i]=a.charCodeAt(i);return out;}
document.getElementById('unlock-form').addEventListener('submit', async event=>{
 event.preventDefault();btn.disabled=true;statusEl.textContent='解密中…';
 try{
   if(!window.crypto?.subtle||!window.DecompressionStream)throw new Error('browser');
   const password=document.getElementById('password').value;
   const imported=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(CONFIG.salt),iterations:CONFIG.iterations,hash:'SHA-256'},imported,{name:'AES-GCM',length:256},false,['decrypt']);
   const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(CONFIG.iv)},key,fromBase64(CONFIG.ciphertext));
   const stream=new Blob([plaintext]).stream().pipeThrough(new DecompressionStream('gzip'));
   const text=await new Response(stream).text();
   document.open();document.write(text);document.close();
 }catch(e){statusEl.textContent=e?.message==='browser'?'請使用支援安全解密的最新瀏覽器。':'密碼不正確。';btn.disabled=false;}
});
